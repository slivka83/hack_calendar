<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML-соревнования и хакатоны — Гантт</title>
<meta name="description" content="Диаграмма Ганта: ближайшие ML-соревнования и хакатоны. Даты, призы, форматы.">
<style>
  :root {
    --bg: #0e1420;
    --panel: #151d2e;
    --panel-2: #1a2338;
    --border: #25304a;
    --text: #e8edf7;
    --muted: #8d99b3;
    --hack: #ff8a3d;
    --sor: #3fa9f5;
    --today: #ff5d5d;
    --corner-w: 330px;
    --header-h: 46px;
    --row-h: 52px;
    --day-w: 4px;
    --bar: #6c7cf5;
    --bar-dark: #5564e0;
    --bar-final: #4a52b0;
    --reg: #ffd76a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
  }
  .topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: .2px; }
  .topbar .subtitle { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .controls { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .controls input[type="search"] {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    width: 190px;
    font: inherit;
    outline: none;
  }
  .controls input[type="search"]:focus { border-color: #3f5a8c; }

  /* ---------- Gantt ---------- */
  .gantt-scroll {
    flex: 1;
    overflow: auto;
    position: relative;
  }
  .gantt-inner {
    position: relative;
    width: calc(var(--corner-w) + var(--timeline-w));
    min-height: 100%;
  }
  .gantt-header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    height: var(--header-h);
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .corner {
    position: sticky;
    left: 0;
    z-index: 30;
    flex: 0 0 var(--corner-w);
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 14px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--muted);
  }
  .months {
    flex: 0 0 var(--timeline-w);
    display: flex;
  }
  .gantt-body {
    display: flex;
    align-items: flex-start;
  }
  .month-cell {
    border-right: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    flex: none;
  }
  .names-col {
    position: sticky;
    left: 0;
    z-index: 15;
    flex: 0 0 var(--corner-w);
    background: var(--bg);
    border-right: 1px solid var(--border);
  }
  .timeline {
    position: relative;
    flex: 0 0 var(--timeline-w);
    height: calc(var(--row-h) * var(--rows));
    background:
      repeating-linear-gradient(to right, transparent 0, transparent calc(var(--day-w)*7 - 1px), rgba(37,48,74,.55) calc(var(--day-w)*7 - 1px), rgba(37,48,74,.55) calc(var(--day-w)*7));
  }

  .name-row {
    height: var(--row-h);
    border-bottom: 1px solid rgba(37,48,74,.6);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    background: var(--bg);
  }
  .name-row .tag {
    flex: none;
    width: 34px;
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    border-radius: 5px;
    padding: 2px 0;
    letter-spacing: .3px;
  }
  .tag-hack { background: rgba(255,138,61,.16); color: var(--hack); border: 1px solid rgba(255,138,61,.4); }
  .tag-sor { background: rgba(63,169,245,.16); color: var(--sor); border: 1px solid rgba(63,169,245,.4); }
  .name-row .info { min-width: 0; }
  .name-row .info .n {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .name-row:hover { background: var(--panel-2); }

  /* ---------- Bars ---------- */
  .bar-track {
    position: absolute;
    height: var(--row-h);
    border-bottom: 1px solid rgba(37,48,74,.6);
  }
  .bar {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    height: 26px;
    border-radius: 7px;
    cursor: pointer;
    transition: filter .12s, transform .12s;
    background: linear-gradient(180deg, #8493ff, var(--bar-dark));
    box-shadow: 0 2px 10px rgba(108,124,245,.35);
    font-size: 11px;
    font-weight: 600;
    color: #fff;
  }
  .bar:hover { filter: brightness(1.25); transform: translateY(-50%) scaleY(1.12); }
  .bar .bar-label {
    position: absolute;
    inset: 0 8px;
    display: flex;
    align-items: center;
    overflow: hidden;
    white-space: nowrap;
  }
  .bar.final {
    background: repeating-linear-gradient(135deg, var(--bar-final) 0, var(--bar-final) 5px, #3d4498 5px, #3d4498 10px);
    box-shadow: 0 2px 10px rgba(74,82,176,.35);
  }
  .bar-chip {
    position: absolute;
    top: -13px;
    left: 0;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: .4px;
    color: #aab2f5;
    white-space: nowrap;
    pointer-events: none;
  }
  .bar.approx::after {
    content: "?";
    position: absolute;
    right: 5px;
    top: 3px;
    font-size: 10px;
    font-weight: 800;
    background: rgba(0,0,0,.35);
    border-radius: 50%;
    width: 13px;
    height: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .reg-mark {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--reg);
    z-index: 5;
    pointer-events: none;
  }
  .reg-chip {
    position: absolute;
    top: 2px;
    left: 4px;
    font-size: 9.5px;
    font-weight: 600;
    color: var(--reg);
    white-space: nowrap;
    background: rgba(14,20,32,.85);
    padding: 1px 5px;
    border-radius: 4px;
  }

  .today-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--today);
    z-index: 25;
    pointer-events: none;
  }
  .today-line .today-chip {
    position: sticky;
    top: var(--header-h);
    margin-top: 8px;
    margin-left: -1px;
    background: var(--today);
    color: #fff;
    font-size: 10.5px;
    font-weight: 700;
    border-radius: 5px;
    padding: 2px 7px;
    white-space: nowrap;
    display: inline-block;
  }

  .empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 15px;
    z-index: 5;
    background: rgba(14,20,32,.6);
  }

  /* ---------- Tooltip ---------- */
  .tooltip {
    position: fixed;
    z-index: 100;
    max-width: 400px;
    background: #1b2440;
    border: 1px solid #35456f;
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: 0 10px 34px rgba(0,0,0,.55);
    pointer-events: none;
    font-size: 12.5px;
  }
  .tooltip.hidden { display: none; }
  .tooltip .tt-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .tooltip .tag {
    flex: none;
    width: 38px;
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    border-radius: 5px;
    padding: 2px 0;
    letter-spacing: .3px;
  }
  .tooltip .tt-name { font-size: 14px; font-weight: 700; }
  .tooltip .tt-dates { color: var(--muted); margin-bottom: 8px; font-size: 12px; }
  .tooltip .tt-row { margin: 4px 0; }
  .tooltip .tt-label { color: var(--muted); margin-right: 6px; }
  .tooltip .tt-prize { font-weight: 700; color: #ffd76a; }
  .tooltip ul { margin: 4px 0 4px 18px; color: #c7d2e8; }
  .tooltip ul li { margin: 3px 0; }
</style>
</head>
<body>

<header class="topbar">
  <div>
    <h1>ML-соревнования и хакатоны</h1>
    <div class="subtitle" id="subtitle">Загрузка…</div>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Поиск по названию или задаче…">
  </div>
</header>

<div class="gantt-scroll" id="ganttScroll">
  <div class="gantt-inner" id="ganttInner"></div>
</div>

<div class="tooltip hidden" id="tooltip"></div>

<script src="data.js"></script>
<script>
(function () {
  const DAY_W = 4;
  const ROW_H = 52;
  const HEADER_H = 46;
  const CORNER_W = 330;
  const FINAL_DAYS = 2;
  const MONTHS = ["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];

  const ganttInner = document.getElementById("ganttInner");
  const scrollEl = document.getElementById("ganttScroll");
  const tooltip = document.getElementById("tooltip");
  const search = document.getElementById("search");
  const subtitle = document.getElementById("subtitle");

  const parseISO = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const dayIdx = d => Math.round((d - MIN) / 86400000);
  const fmtDate = iso => {
    const [y, m, d] = iso.split("-").map(Number);
    return d + "." + String(m).padStart(2, "0");
  };

  let MIN, MAX, TOTAL_DAYS, TIMELINE_W;
  let state = { query: "" };

  function isoOf(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function buildSegments(h) {
    if (h.phases) {
      return h.phases.map((p, i) => ({
        start: p.start, end: p.end, label: p.label, start_approx: p.start_approx,
        kind: i === h.phases.length - 1 ? "final" : "main"
      }));
    }
    const segs = [{ start: h.start, end: h.end, label: null, start_approx: h.start_approx, kind: "main" }];
    const hasFinal = (h.format || "").toLowerCase().includes("финал");
    const dur = Math.round((parseISO(h.end) - parseISO(h.start)) / 86400000);
    if (hasFinal && dur >= 4) {
      const finalStart = new Date(parseISO(h.end).getTime() - (FINAL_DAYS - 1) * 86400000);
      segs[0].end = isoOf(new Date(finalStart.getTime() - 86400000));
      segs.push({ start: isoOf(finalStart), end: h.end, label: "финал", start_approx: false, kind: "final" });
    }
    return segs;
  }

  function computeRange() {
    const all = [];
    HACKS.forEach(h => {
      all.push(parseISO(h.start), parseISO(h.end));
      (h.phases || []).forEach(p => all.push(parseISO(p.start), parseISO(p.end)));
    });
    MIN = new Date(Math.min(...all));
    MIN = new Date(MIN.getFullYear(), MIN.getMonth(), 1);
    MAX = new Date(Math.max(...all));
    MAX = new Date(MAX.getFullYear(), MAX.getMonth() + 1, 0);
    TOTAL_DAYS = Math.round((MAX - MIN) / 86400000) + 1;
    TIMELINE_W = TOTAL_DAYS * DAY_W;
    ganttInner.style.setProperty("--timeline-w", TIMELINE_W + "px");
    ganttInner.style.setProperty("--rows", HACKS.length);
  }

  function matches(h) {
    if (!state.query) return true;
    const q = state.query.toLowerCase();
    return h.name.toLowerCase().includes(q) ||
           h.tasks.some(t => t.toLowerCase().includes(q));
  }

  function visible() { return HACKS.filter(matches); }

  function build() {
    const items = visible();
    const rows = items.length;
    ganttInner.style.setProperty("--rows", Math.max(rows, 1));
    subtitle.textContent = `${HACKS.length} событий · ${rows} показано`;
    ganttInner.innerHTML = "";

    if (!rows) {
      ganttInner.innerHTML = '<div class="empty">Ничего не найдено</div>';
      return;
    }

    /* header row: corner + months */
    const header = document.createElement("div");
    header.className = "gantt-header";

    const corner = document.createElement("div");
    corner.className = "corner";
    corner.textContent = "Событие";
    header.appendChild(corner);

    const months = document.createElement("div");
    months.className = "months";
    let m = new Date(MIN.getFullYear(), MIN.getMonth(), 1);
    while (m <= MAX) {
      const days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
      const cell = document.createElement("div");
      cell.className = "month-cell";
      cell.style.width = days * DAY_W + "px";
      cell.textContent = MONTHS[m.getMonth()] + " " + String(m.getFullYear()).slice(2);
      months.appendChild(cell);
      m = new Date(m.getFullYear(), m.getMonth() + 1, 1);
    }
    header.appendChild(months);
    ganttInner.appendChild(header);

    /* body row: names + timeline */
    const body = document.createElement("div");
    body.className = "gantt-body";

    const names = document.createElement("div");
    names.className = "names-col";
    names.style.height = rows * ROW_H + "px";

    /* timeline */
    const timeline = document.createElement("div");
    timeline.className = "timeline";
    timeline.style.width = TIMELINE_W + "px";
    timeline.style.height = rows * ROW_H + "px";

    /* month boundary lines */
    m = new Date(MIN.getFullYear(), MIN.getMonth() + 1, 1);
    while (m <= MAX) {
      const ln = document.createElement("div");
      ln.style.cssText = `position:absolute;top:0;bottom:0;width:1px;background:rgba(37,48,74,.9);left:${dayIdx(m) * DAY_W}px;`;
      timeline.appendChild(ln);
      m = new Date(m.getFullYear(), m.getMonth() + 1, 1);
    }

    items.forEach((h, i) => {
      const y = i * ROW_H;

      const nameRow = document.createElement("div");
      nameRow.className = "name-row";
      nameRow.innerHTML =
        `<span class="tag ${h.type === "ХАК" ? "tag-hack" : "tag-sor"}">${h.type === "ХАК" ? "ХАК" : "СОР"}</span>` +
        `<div class="info"><div class="n"></div></div>`;
      nameRow.querySelector(".n").textContent = h.name;
      names.appendChild(nameRow);

      const track = document.createElement("div");
      track.className = "bar-track";
      track.style.top = y + "px";
      track.style.width = TIMELINE_W + "px";

      buildSegments(h).forEach(seg => {
        const x0 = dayIdx(parseISO(seg.start)) * DAY_W;
        const x1 = (dayIdx(parseISO(seg.end)) + 1) * DAY_W;
        const w = x1 - x0;
        if (w <= 0) return;
        const bar = document.createElement("div");
        bar.className = "bar" + (seg.kind === "final" ? " final" : "") + (seg.start_approx ? " approx" : "");
        bar.style.left = x0 + "px";
        bar.style.width = w + "px";
        if (seg.label && w > 96) {
          const lbl = document.createElement("span");
          lbl.className = "bar-label";
          lbl.textContent = seg.label;
          bar.appendChild(lbl);
        } else if (seg.kind === "final" || seg.label) {
          const chip = document.createElement("span");
          chip.className = "bar-chip";
          chip.textContent = seg.kind === "final" ? (seg.label || "финал") : seg.label;
          bar.appendChild(chip);
        }
        bar.addEventListener("mouseenter", e => showTip(e, h));
        bar.addEventListener("mousemove", moveTip);
        bar.addEventListener("mouseleave", hideTip);
        track.appendChild(bar);
      });

      if (h.registration && h.registration.startsWith("до ")) {
        const dm = h.registration.slice(3);
        const [d, mo] = dm.split(".").map(Number);
        const x = dayIdx(new Date(MIN.getFullYear(), mo - 1, d)) * DAY_W;
        if (x >= 0 && x <= TIMELINE_W) {
          const mk = document.createElement("div");
          mk.className = "reg-mark";
          mk.style.left = x + "px";
          mk.innerHTML = `<span class="reg-chip">рег. ${dm}</span>`;
          track.appendChild(mk);
        }
      }
      timeline.appendChild(track);
    });

    body.appendChild(names);
    body.appendChild(timeline);
    ganttInner.appendChild(body);

    /* today line */
    const today = new Date();
    if (today >= MIN && today <= MAX) {
      const t = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const line = document.createElement("div");
      line.className = "today-line";
      line.style.left = dayIdx(t) * DAY_W + "px";
      line.innerHTML = `<span class="today-chip">сегодня ${t.getDate()}.${String(t.getMonth() + 1).padStart(2, "0")}</span>`;
      timeline.appendChild(line);
    }
  }

  /* ---------- tooltip ---------- */
  function showTip(e, h) {
    const fmt = (iso, approx) => (approx ? "≈" : "") + fmtDate(iso);
    let dateLine = fmt(h.start, h.start_approx) + " – " + fmt(h.end, false);
    if (h.phases) dateLine = h.phases.map(p => fmt(p.start, p.start_approx) + " – " + fmt(p.end, false) + (p.label ? " (" + p.label + ")" : "")).join(" · ");
    if (h.registration) dateLine += " · рег. " + h.registration;

    let html =
      `<div class="tt-head"><span class="tag ${h.type === "ХАК" ? "tag-hack" : "tag-sor"}">${h.type === "ХАК" ? "ХАК" : "СОР"}</span>` +
      `<span class="tt-name">${escapeHtml(h.name)}</span></div>` +
      `<div class="tt-dates">${dateLine}</div>`;
    if (h.prize) html += `<div class="tt-row"><span class="tt-label">💰 Приз:</span><span class="tt-prize">${escapeHtml(h.prize)}</span></div>`;
    if (h.tasks.length) html += `<ul>${h.tasks.map(t => "<li>" + escapeHtml(t) + "</li>").join("")}</ul>`;
    if (h.participation) html += `<div class="tt-row"><span class="tt-label">🏀 Участие:</span>${escapeHtml(h.participation)}</div>`;
    if (h.format) html += `<div class="tt-row"><span class="tt-label">🌐 Формат:</span>${escapeHtml(h.format)}</div>`;
    if (h.lang) html += `<div class="tt-row"><span class="tt-label">🖥️</span>${escapeHtml(h.lang)}</div>`;
    tooltip.innerHTML = html;
    tooltip.classList.remove("hidden");
    moveTip(e);
  }
  function moveTip(e) {
    const pad = 14;
    const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
    let x = e.clientX + pad, y = e.clientY + pad;
    if (x + tw > innerWidth - 8) x = e.clientX - tw - pad;
    if (y + th > innerHeight - 8) y = innerHeight - th - 8;
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
  }
  function hideTip() { tooltip.classList.add("hidden"); }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  /* ---------- controls ---------- */
  search.addEventListener("input", () => { state.query = search.value.trim(); build(); });
  scrollEl.addEventListener("scroll", hideTip);

  computeRange();
  build();
})();
</script>
</body>
</html>
