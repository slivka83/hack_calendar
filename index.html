<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1322">
<title>ML-Gantt</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="Диаграмма Ганта: ближайшие ML-соревнования, хакатоны и мероприятия. Даты, призы, форматы.">
<script>
(function () {
  try {
    var saved = localStorage.getItem("hc-theme");
    var theme = saved === "light" || saved === "dark"
      ? saved
      : (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.dataset.theme = theme;
  } catch (e) {}
})();
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1322;
    --panel: #141c2f;
    --panel-2: #1b2542;
    --border: #263154;
    --text: #e9edf8;
    --muted: #8f9cb8;
    --accent: #7c8cf5;
    --today: #ff5d5d;
    --reg: #ffd166;
    --bar-hi: #8a97ff;
    --fmt-online: #57d68a;
    --fmt-offline: #ff9a56;
    --fmt-hybrid: #b18cff;
    --scroll-thumb: #2c3a63;
    --cal-sep: #a3264a;
    --corner-w: 330px;
    --header-h: 34px;
    --row-h: 62px;
    --bar-h: 26px;
    --timeline-w: 0px;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #eef1f7;
    --panel: #ffffff;
    --panel-2: #e6eaf4;
    --border: #ccd5e8;
    --text: #1d2740;
    --muted: #5b6a8c;
    --accent: #4c5ae0;
    --today: #e03434;
    --reg: #b98a00;
    --bar-hi: #7180ef;
    --fmt-online: #1f9d57;
    --fmt-offline: #d96414;
    --fmt-hybrid: #7c50e8;
    --scroll-thumb: #b6c2de;
    --cal-sep: #801f3c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    transition: background-color .25s, color .25s;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 40%, transparent); }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
    transition: background-color .25s, border-color .25s;
  }
  .title-block { min-width: 0; }
  .topbar h1 { display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 700; letter-spacing: .2px; }
  .logo { flex: none; }

  .tabs { margin-right: auto; padding: 4px; }
  .tabs .seg-btn { font-size: 13px; padding: 5px 12px; font-weight: 600; }

  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .seg {
    display: flex;
    gap: 2px;
    padding: 3px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .seg-btn {
    appearance: none;
    background: none;
    border: 1px solid transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 7px;
    cursor: pointer;
    white-space: nowrap;
    transition: color .15s, background-color .15s, border-color .15s;
  }
  .seg-btn:hover { color: var(--text); }
  .seg-btn.is-active {
    color: var(--text);
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    border-color: color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .seg-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .seg-btn:disabled { opacity: .4; cursor: default; }
  .is-hidden { display: none !important; }

  .controls input[type="search"] {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 9px;
    padding: 7px 12px;
    width: 240px;
    font: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .controls input[type="search"]::placeholder { color: var(--muted); }
  .controls input[type="search"]:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .controls input[type="search"]:focus-visible {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }

  .icon-btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    flex: none;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--muted);
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .icon-btn:hover { color: var(--text); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .suggest-btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    flex: none;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    background: color-mix(in srgb, var(--accent) 30%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 70%, transparent);
    border-radius: 9px;
    padding: 6px 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color .15s, border-color .15s;
  }
  .suggest-btn:hover { background: color-mix(in srgb, var(--accent) 44%, transparent); border-color: var(--accent); }
  .suggest-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Gantt ---------- */
  .gantt-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .gantt-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
  }
  .gantt-scroll::-webkit-scrollbar { width: 10px; }
  .gantt-scroll::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 6px; border: 2px solid var(--bg); }
  .gantt-scroll::-webkit-scrollbar-track { background: transparent; }
  @supports not selector(::-webkit-scrollbar) {
    .gantt-scroll { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
  }
  .gantt-inner {
    position: relative;
    width: calc(var(--corner-w) + var(--timeline-w));
    min-height: 100%;
  }
  .gantt-header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    height: var(--header-h);
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .corner {
    position: sticky;
    left: 0;
    z-index: 30;
    flex: 0 0 var(--corner-w);
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 14px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--muted);
  }
  .months { flex: 0 0 var(--timeline-w); display: flex; }
  .month-cell {
    border-right: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .6px;
    flex: none;
    overflow: hidden;
    white-space: nowrap;
  }
  .month-cell:nth-child(even) { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .gantt-body { display: flex; align-items: flex-start; }
  .names-col {
    position: sticky;
    left: 0;
    z-index: 15;
    flex: 0 0 var(--corner-w);
    min-width: 0;
    background: var(--bg);
    border-right: 1px solid var(--border);
  }
  .timeline {
    position: relative;
    flex: 0 0 var(--timeline-w);
    isolation: isolate;
  }
  .month-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: color-mix(in srgb, var(--border) 90%, transparent);
  }
  .month-band {
    position: absolute;
    top: 0;
    bottom: 0;
    background: color-mix(in srgb, var(--accent) 5%, transparent);
  }

  .name-row {
    height: var(--row-h);
    border-bottom: 1px solid color-mix(in srgb, var(--border) 55%, transparent);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    overflow: hidden;
  }
  .name-row:hover, .name-row.is-hover { background: var(--panel-2); }

  .name-row .info {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .n-line { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .n-line .n {
    min-width: 0;
    font-size: 13.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    text-decoration: underline dashed;
    text-decoration-color: color-mix(in srgb, var(--muted) 75%, transparent);
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    transition: color .15s, text-decoration-color .15s;
  }
  .n-line .n:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .src {
    flex: none;
    display: inline-flex;
    padding: 2px;
    border-radius: 5px;
    color: var(--muted);
    opacity: .55;
    transition: color .15s, opacity .15s;
  }
  .name-row:hover .src, .src:hover, .src:focus-visible { color: var(--accent); opacity: 1; }
  .src:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.src { background: none; border: none; font: inherit; cursor: pointer; }

  .chips { display: flex; flex-wrap: nowrap; gap: .38em; overflow: hidden; min-width: 0; width: max-content; font-size: 10.5px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: .476em;
    font-size: 1em;
    font-weight: 600;
    line-height: 1;
    padding: .333em .667em;
    border-radius: 999px;
    color: var(--muted);
    background: color-mix(in srgb, var(--muted) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--muted) 22%, transparent);
    white-space: nowrap;
  }
  .chip-prize {
    color: var(--reg);
    background: color-mix(in srgb, var(--reg) 10%, transparent);
    border-color: color-mix(in srgb, var(--reg) 32%, transparent);
  }
  .chip-track {
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border-color: color-mix(in srgb, var(--accent) 38%, transparent);
  }
  .chip-fmt::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--fmt); }
  .fmt-online { --fmt: var(--fmt-online); }
  .fmt-offline { --fmt: var(--fmt-offline); }
  .fmt-hybrid { --fmt: var(--fmt-hybrid); }

  /* ---------- Bars ---------- */
  .bar-track {
    position: absolute;
    height: var(--row-h);
    border-bottom: 1px solid color-mix(in srgb, var(--border) 55%, transparent);
  }
  .bar-track.is-hover { background: color-mix(in srgb, var(--panel-2) 50%, transparent); }
  .bar {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    height: var(--bar-h);
    min-width: 3px;
    border-radius: 6px;
    cursor: pointer;
    transition: filter .15s, transform .15s;
    background: var(--bar-hi);
  }
  .bar::before { content: ""; position: absolute; inset: -4px -2px; }
  .bar:hover { filter: brightness(1.2); transform: translateY(-50%) scaleY(1.12); }
  .bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .reg-mark {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    height: var(--bar-h);
    width: 2px;
    background: var(--reg);
    z-index: 5;
    cursor: help;
  }
  .reg-mark::before {
    content: "";
    position: absolute;
    top: -3px;
    left: 50%;
    width: 6px;
    height: 6px;
    transform: translateX(-50%) rotate(45deg);
    background: var(--reg);
  }
  .reg-mark::after { content: ""; position: absolute; top: 0; bottom: 0; left: -5px; right: -5px; }

  .today-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    z-index: 30;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      var(--today) 0 4px,
      transparent 4px 8px
    );
  }

  .empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--muted);
    font-size: 15px;
    z-index: 5;
    background: color-mix(in srgb, var(--bg) 70%, transparent);
  }
  .link {
    background: none;
    border: none;
    color: var(--accent);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .link:hover, .link:focus-visible { color: var(--bar-hi); }

  /* ---------- Calendar ---------- */
  .calendar-wrap { flex: 1; min-height: 0; display: none; }
  .calendar-wrap.is-active { display: flex; }
  .calendar-scroll { flex: 1; min-height: 0; overflow: auto; }
  .cal-nav { display: none; align-items: center; gap: 2px; }
  .cal-nav.is-active { display: flex; }
  .cal-nav .seg-btn { padding: 5px 10px; font-weight: 700; }
  .cal-nav #calPrev, .cal-nav #calNext { font-size: 15px; line-height: 1; padding: 2px 10px; }
  .cal-fmt { display: none; }
  .cal-fmt.is-active { display: flex; }
  .cal-fmt .seg-btn { padding: 5px 10px; display: inline-flex; align-items: center; gap: 6px; }
  .cal-fmt .seg-btn::before {
    content: "";
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--fmt-dot);
  }
  .cal-fmt .seg-btn[data-fmt="online"] { --fmt-dot: var(--fmt-online); }
  .cal-fmt .seg-btn[data-fmt="offline"] { --fmt-dot: var(--fmt-offline); }
  .cal-fmt .seg-btn[data-fmt=""]::before { display: none; }
  .cal-months {
    position: relative;
    display: grid;
    grid-template-columns: 44px repeat(7, minmax(0, 1fr));
    grid-auto-rows: minmax(96px, auto);
    background: var(--panel);
  }
  .cal-rail {
    grid-column: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 0;
    background: var(--panel-2);
    border-right: 1px solid var(--border);
  }
  .cal-rail span {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }
  .cal-frames { position: absolute; inset: 0; pointer-events: none; }
  .cal-hline, .cal-vline { position: absolute; background-color: var(--cal-sep); }
  .cal-hline { height: 1px; }
  .cal-vline { width: 1px; }
  .cal-dow-row {
    position: sticky;
    top: 0;
    z-index: 7;
    display: grid;
    grid-template-columns: 44px repeat(7, minmax(0, 1fr));
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
  }
  .cal-dow {
    padding: 8px 10px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--muted);
    text-align: center;
  }
  .cal-dow + .cal-dow { border-left: 1px solid var(--border); }
  .cal-day {
    min-height: 96px;
    min-width: 0;
    padding: 6px;
    border-top: 1px solid var(--border);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .cal-day--mon { border-left: none; }
  .cal-day--weekend { background-color: color-mix(in srgb, var(--panel) 50%, var(--bg)); }
  .cal-day.is-today {
    background-image: repeating-linear-gradient(135deg,
      color-mix(in srgb, var(--accent) 8%, transparent) 0 5px,
      transparent 5px 10px);
  }
  .cal-day.is-today .cal-day-num { color: var(--accent); font-weight: 700; }
  .cal-day-num { font-size: 11px; color: var(--muted); padding: 0 2px; }
  .cal-ev {
    --ev: var(--accent);
    appearance: none;
    display: flex;
    align-items: baseline;
    gap: 4px;
    width: 100%;
    min-width: 0;
    text-align: left;
    font: inherit;
    font-size: 11px;
    line-height: 1.3;
    padding: 3px 6px;
    border-radius: 6px;
    border: 1px solid color-mix(in srgb, var(--ev) 35%, transparent);
    border-left: 3px solid var(--ev);
    background: color-mix(in srgb, var(--ev) 12%, var(--panel));
    color: var(--text);
    cursor: pointer;
    transition: filter .15s;
  }
  .cal-ev-time {
    flex: none;
    font-variant-numeric: tabular-nums;
    padding-right: 5px;
    border-right: 1px solid color-mix(in srgb, currentColor 35%, transparent);
  }
  .cal-ev-name {
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cal-ev-video {
    flex: none;
    display: inline-flex;
    align-self: center;
    margin-left: auto;
    opacity: .7;
  }
  .cal-ev-video svg { display: block; }
  .cal-ev:hover { filter: brightness(1.15); }
  .cal-ev:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .cal-ev--online { --ev: var(--fmt-online); }
  .cal-ev--offline { --ev: var(--fmt-offline); }
  .cal-ev--hybrid { --ev: var(--fmt-hybrid); }
  .cal-empty {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 60px 0;
    color: var(--muted);
    font-size: 15px;
  }
  .cal-empty.is-active { display: flex; }

  /* ---------- Calendar agenda (mobile) ---------- */
  .cal-agenda { display: block; background: var(--panel); padding: 0 12px 24px; }
  .cal-agenda-month {
    position: sticky;
    top: 0;
    z-index: 6;
    margin: 0 -12px;
    padding: 9px 12px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .6px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .cal-agenda-day {
    margin: 14px 0 6px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .3px;
    color: var(--muted);
  }
  .cal-agenda-day.is-today { color: var(--accent); }
  .cal-agenda-ev { margin-bottom: 5px; padding: 7px 9px; font-size: 12.5px; }
  .cal-agenda-ev .cal-ev-name { flex: 1 1 auto; white-space: normal; overflow: visible; text-overflow: clip; }
  .cal-agenda-until { flex: none; color: var(--muted); font-size: 11px; }

  /* ---------- Tooltip ---------- */
  .tooltip {
    position: fixed;
    z-index: 100;
    max-width: min(420px, calc(100vw - 16px));
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    pointer-events: none;
    font-size: 13.5px;
    line-height: 1.55;
  }
  .tooltip .tt-name { font-size: 15px; }
  .tooltip.hidden { display: none; }
  .tt-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .tt-name { font-size: 14px; font-weight: 700; }
  .tt-fav { flex: none; width: 18px; height: 18px; border-radius: 4px; object-fit: contain; }
  .tt-dates { color: var(--muted); margin-bottom: 8px; font-size: 12px; }
  .tt-desc { margin: 0 0 8px; color: color-mix(in srgb, var(--text) 85%, var(--muted)); font-size: 12.5px; }
  .tt-row { margin: 4px 0; }
  .tt-label { color: var(--muted); margin-right: 6px; }
  .tt-prize { font-weight: 700; color: var(--reg); }
  .tt-section { margin: 8px 0 2px; }
  .tt-list { margin: 2px 0 8px 24px; color: color-mix(in srgb, var(--text) 82%, var(--muted)); overflow-wrap: anywhere; }
  .tt-list li { margin: 3px 0; }
  .tt-talks { list-style: none; margin: 4px 0 10px; padding: 0; }
  .tt-talks li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 10px; margin: 5px 0; }
  .tt-talks--notime li { grid-template-columns: minmax(0, 1fr); }
  .tt-talks--notime .tt-talk-time { display: none; }
  .tt-talk-time { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tt-talk-link { color: var(--accent); text-decoration: none; }
  .tt-talk-link:hover, .tt-talk-link:focus-visible {
    color: var(--bar-hi);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .tt-when { color: var(--muted); margin: 3px 0; display: flex; gap: 7px; }
  .tt-when:last-child { margin-bottom: 0; }
  .tt-ico { flex: none; }
  .tt-link { color: var(--accent); text-underline-offset: 3px; }
  .tt-link:hover, .tt-link:focus-visible { color: var(--bar-hi); }
  button.tt-link { background: none; border: none; padding: 0; font: inherit; font-weight: 600; cursor: pointer; }

  const isMobile = () => window.innerWidth <= MOBILE_MAX;

  const fmtDate = (iso, withYear) => {
    const [year, month, day] = iso.split("-");
    return Number(day) + "." + month + (withYear ? "." + year : "");

  const fmtRange = (start, end, approx, withYear) =>
    (approx ? "≈" : "") + fmtDate(start, withYear) + " – " + fmtDate(end, withYear);

  const stripLabel = value => value.replace(/^(Приз(?:ы)?|Участие|Формат):\s*/, "");
  const hostOf = url => {
    try {
      return new URL(url).hostname;
    } catch (e) {
      return "";
    }
  };

  const ymd = date => date.getFullYear() + "-" + pad2(date.getMonth() + 1) + "-" + pad2(date.getDate());
  const ymOf = date => date.getFullYear() + "-" + pad2(date.getMonth() + 1);
  const compactDate = iso => iso.replace(/-/g, "");
  const hhmm = minutes => pad2(Math.floor(minutes / 60)) + ":" + pad2(minutes % 60);

  function todayMidnight() {
    const now = new Date();
    return new Date(now.getFullYear(), now.getMonth(), now.getDate());
  }

  function showYear() {
    return Boolean(scale.min && scale.max && scale.min.getFullYear() !== scale.max.getFullYear());
  }

  function addDaysISO(iso, days) {
    const date = parseISO(iso);
    date.setDate(date.getDate() + days);

  /* ==========================================================================
     Представление событий (чипы, формат, приз)
     ========================================================================== */

  function trackTags(h) {
    const seen = new Set();
    const tags = [];
    (h.tasks || []).forEach(task => {
      const match = task.match(/^\[([^\]]+)\]/);
      if (!match) return;
      match[1].split(/[,/]+/).forEach(part => {
        const tag = part.trim().toUpperCase();
        if (tag && !seen.has(tag)) {
          seen.add(tag);
          tags.push(tag);
        }
      });
    });
    return tags;
  }

  function moneyUnit(unit) {
    const value = unit.toLowerCase();
    for (const [pattern, multiplier, currency] of MONEY_UNITS) {
      if (pattern.test(value)) return { multiplier, currency };
    }
    return { multiplier: 1, currency: "₽" };
  }

  function moneyTotal(text) {
    let total = 0;
    let currency = null;
    for (const match of text.matchAll(MONEY_RE)) {
      const unit = moneyUnit(match[2].trim());
      if (currency && unit.currency !== currency) continue;
      currency = currency || unit.currency;
      total += parseInt(match[1].replace(/[\s\u00a0]/g, ""), 10) * unit.multiplier;
    }
    if (currency == null) return null;
    return String(total).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " " + currency;
  }

  function prizeText(h) {
    return h.prize ? moneyTotal(stripLabel(h.prize)) : null;
  }

  function formatOf(h) {
    const value = h.format || "";
    const online = FORMAT_RULES.online.test(value);
    const offline = FORMAT_RULES.offline.test(value);
    if (FORMAT_RULES.hybrid.test(value) || (online && offline)) {
      return { kind: "hybrid", label: "гибрид" };
    }
    if (online) return { kind: "online", label: "онлайн" };
    if (offline) return { kind: "offline", label: "офлайн" };
    return null;
  }

  function participationText(h) {
    if (!h.participation) return null;
    const value = h.participation;
    const solo = /соло/i.test(value);
    const team = /команд/i.test(value);
    if (solo && team) return "соло/команда";
    if (solo) return "соло";
    if (team) return "команда";
    return null;
  }

  function renderChips(h) {
    const chips = el("div", "chips");
    trackTags(h).forEach(tag => chips.appendChild(el("span", "chip chip-track", tag)));

    const prize = prizeText(h);
    if (prize) chips.appendChild(el("span", "chip chip-prize", prize));

    const format = formatOf(h);
    if (format) chips.appendChild(el("span", "chip chip-fmt fmt-" + format.kind, format.label));

    const participation = participationText(h);
    if (participation) chips.appendChild(el("span", "chip", participation));

    return chips.childElementCount ? chips : null;
  }

  /* ==========================================================================
     Модель событий
     ========================================================================== */

  function segmentsOf(h) {
    if (Array.isArray(h.phases) && h.phases.length) {
      return h.phases.map(phase => ({ start: phase.start, end: phase.end }));
    }
    return [{ start: h.start, end: h.end }];
  }

  function regDeadline(h) {
    if (h.registration_iso) return parseISO(h.registration_iso);
    if (!h.registration || !h.registration.startsWith("до ")) return null;
    const match = h.registration.match(/^до (\d{1,2})\.(\d{1,2})$/);
    if (!match) return null;
    const month = Number(match[2]);
    const day = Number(match[1]);
    const start = parseISO(h.start);
    let best = null;
    for (const year of [start.getFullYear() - 1, start.getFullYear(), start.getFullYear() + 1]) {
      const date = new Date(year, month - 1, day);
      if (date >= scale.min && date <= scale.max) return date;
      if (!best || Math.abs(date - start) < Math.abs(best - start)) best = date;
    }
    return best;
  }

  function eventDates(h) {
    const dates = [parseISO(h.start), parseISO(h.end)];
    (h.phases || []).forEach(phase => dates.push(parseISO(phase.start), parseISO(phase.end)));
    return dates;
  }

  function dataMaxDate() {
    let max = -Infinity;
    state.events.forEach(h => {
      eventDates(h).forEach(date => {
        max = Math.max(max, date.getTime());
      });
    });
    return new Date(max);
  }

  function rangeWindow() {
    if (!state.range || !state.events.length) return null;
    const last = dataMaxDate();
    return {
      from: new Date(last.getFullYear(), last.getMonth() - (state.range - 1), 1),
      to: new Date(last.getFullYear(), last.getMonth() + 1, 0),
    };
  }

  function baseEvents() {
    const windowRange = rangeWindow();
    if (!windowRange) return state.events;
    return state.events.filter(h =>
      eventDates(h).every(date => date >= windowRange.from && date <= windowRange.to)
    );
  }

  function computeRange(base) {
    if (!base.length) return false;
    const stamps = [];
    base.forEach(h => {
      eventDates(h).forEach(date => stamps.push(date));
    });
    let lo = Math.min.apply(null, stamps);
    let hi = Math.max.apply(null, stamps);
    const windowRange = rangeWindow();
    if (windowRange) {
      lo = windowRange.from.getTime();
      hi = windowRange.to.getTime();
    }
    const loDate = new Date(lo);
    const hiDate = new Date(hi);
    const months = (hiDate.getFullYear() - loDate.getFullYear()) * 12 +
      (hiDate.getMonth() - loDate.getMonth()) + 1;
    if (months > 12) {
      scale.min = new Date(loDate.getFullYear(), 0, 1);
      scale.max = new Date(hiDate.getFullYear(), 11, 31);
    } else {
      scale.min = new Date(loDate.getFullYear(), loDate.getMonth(), 1);
      scale.max = new Date(hiDate.getFullYear(), hiDate.getMonth() + 1, 0);
    }
    scale.totalDays = Math.round((scale.max - scale.min) / MS_DAY) + 1;
    return true;
  }

  function eventLastDate(h) {
    return eventDates(h).reduce((latest, date) => (date > latest ? date : latest));
  }

  function isActual(h) {
    return todayMidnight() <= eventLastDate(h);
  }

  function canSignup(h) {
    const deadline = h.registration_iso ? parseISO(h.registration_iso) : parseISO(h.end);
    return todayMidnight() <= deadline;
  }

  function matches(h) {
    if (state.tab === "comp") {
      if (state.actual && !isActual(h)) return false;
      if (state.signup && !canSignup(h)) return false;
    } else if (state.fmt) {
      const format = formatOf(h);
      const kind = format ? format.kind : "";
      if (kind !== state.fmt && kind !== "hybrid") return false;
    }
    if (!state.query) return true;
    return h.name.toLowerCase().includes(state.query) ||
      (h.type || "").toLowerCase().includes(state.query) ||
      (h.description || "").toLowerCase().includes(state.query) ||
      (h.tasks || []).some(task => task.toLowerCase().includes(state.query));
  }

  /* ==========================================================================
     Время события
     ========================================================================== */

  function timeOf(h) {
    const raw = (h.time || "").trim();
    if (raw && /[–-]/.test(raw)) return raw;
    const talkMinutes = (h.talks || [])
      .map(talk => ((talk && talk.time) || "").trim().match(/^(\d{1,2}):(\d{2})$/))
      .filter(Boolean)
      .map(match => +match[1] * 60 + +match[2]);
    let start = null;
    let suffix = " мск";
    if (raw) {
      const match = raw.match(/(\d{1,2}:\d{2})/);
      if (!match) return raw;
      start = +match[1].split(":")[0] * 60 + +match[1].split(":")[1];
      suffix = raw.slice(match.index + match[0].length);
    } else if (talkMinutes.length) {
      start = Math.min(...talkMinutes);
    } else {
      return null;
    }
    if (!talkMinutes.length) return raw || null;
    const end = Math.max(...talkMinutes);
    if (end <= start) return raw || hhmm(start) + suffix;
    return hhmm(start) + "–" + hhmm(end) + suffix;
  }

  function startTimeOf(h) {
    const match = (timeOf(h) || "").match(/(\d{1,2}):(\d{2})/);
    return match ? { label: match[0], minutes: +match[1] * 60 + +match[2] } : null;
  }

  /* ==========================================================================
     Диаграмма Ганта: шкала и отрисовка
     ========================================================================== */

  function usesYears() {
    let months = 0;
    let cursor = new Date(scale.min.getFullYear(), scale.min.getMonth(), 1);
    while (cursor <= scale.max) {
      months++;
      cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
    }
    return months > 12 || scale.dayWidth * 28 < MIN_MONTH_CELL_W;
  }

  function buildCells() {
    const cells = [];
    if (usesYears()) {
      let x = 0;
      for (let year = scale.min.getFullYear(); year <= scale.max.getFullYear(); year++) {
        const from = new Date(Math.max(new Date(year, 0, 1).getTime(), scale.min.getTime()));
        const to = new Date(Math.min(new Date(year + 1, 0, 1).getTime(), scale.max.getTime() + MS_DAY));
        const width = (to - from) / MS_DAY / scale.totalDays * scale.width;
        cells.push({ from, to, x, w: width, label: String(year) });
        x += width;
      }
    } else {
      let month = new Date(scale.min.getFullYear(), scale.min.getMonth(), 1);
      while (month <= scale.max) {
        const next = new Date(month.getFullYear(), month.getMonth() + 1, 1);
        cells.push({
          from: month,
          to: next,
          x: Math.round((month - scale.min) / MS_DAY) * scale.dayWidth,
          w: Math.round((next - month) / MS_DAY) * scale.dayWidth,
          label: MONTHS[month.getMonth()] + " " + String(month.getFullYear()).slice(2),
        });
        month = next;
      }
    }
    return cells;
  }

  function xOf(date) {
    if (!scale.cells.length) return 0;
    const time = date.getTime();
    const first = scale.cells[0];
    if (time <= first.from.getTime()) return first.x;
    const last = scale.cells[scale.cells.length - 1];
    if (time >= last.to.getTime()) return last.x + last.w;
    for (const cell of scale.cells) {
      if (time >= cell.from.getTime() && time < cell.to.getTime()) {
        return cell.x + (time - cell.from.getTime()) / (cell.to.getTime() - cell.from.getTime()) * cell.w;
      }
    }
    return last.x + last.w;
  }

  function renderGanttHeader() {
    const header = el("div", "gantt-header");
    const months = el("div", "months");
    const fragment = document.createDocumentFragment();
    scale.cells.forEach(cell => {
      const node = el("div", "month-cell", cell.label);
      node.style.width = cell.w + "px";
      fragment.appendChild(node);
    });
    months.appendChild(fragment);
    header.append(el("div", "corner", "Событие"), months);
    return header;
  }

  function renderGanttNameRow(h) {

    const info = el("div", "info");
    const line = el("div", "n-line");

    name.title = h.name;
    line.appendChild(name);

    if (isHttp(h.url)) {
      line.appendChild(externalIconLink(
        h.url,

      ));
    }

    line.appendChild(externalIconLink(
      googleCalendarUrl(h.name, h.start, h.end, detailsOf(h)),

    ));

    ics.innerHTML = ICONS.ics;
    ics.setAttribute("aria-label", "Скачать .ics: " + h.name);

    const chips = renderChips(h);
    if (chips) info.appendChild(chips);

    row.addEventListener("click", e => {

      openModal(h);
    });

  function renderGanttTrack(h, index, nameRow) {
    const track = el("div", "bar-track");
    track.style.top = index * scale.rowHeight + "px";
    track.style.width = scale.width + "px";
    bindRowHover(nameRow, track);

    for (const segment of segmentsOf(h)) {
      const x0 = xOf(parseISO(segment.start));
      const x1 = xOf(new Date(parseISO(segment.end).getTime() + MS_DAY));
      const width = x1 - x0;
      if (width <= 0) continue;

      const bar = el("div", "bar");
      bar.style.left = x0 + "px";
      bar.style.width = width + "px";
      bar.tabIndex = 0;
      bar.setAttribute("aria-label", h.name);
      bindTip(bar, h);
      bar.addEventListener("click", () => openModal(h));
      bar.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openModal(h);
        }
      });
      bar.addEventListener("focus", () => showTipAtRect(bar.getBoundingClientRect(), h));
      bar.addEventListener("blur", hideTip);
      track.appendChild(bar);
    }

    const deadline = regDeadline(h);
    if (deadline) {
      const x = xOf(deadline);
      if (x >= 0 && x <= scale.width) {
        const mark = el("div", "reg-mark");
        mark.style.left = x + "px";
        mark.setAttribute("aria-label", "Регистрация: " + h.registration);
        bindTip(mark, h);
        mark.addEventListener("click", () => openModal(h));
        track.appendChild(mark);
      }
    }
    return track;
  }

  function renderGanttBody(items) {
    const body = el("div", "gantt-body");
    const names = el("div", "names-col");
    const timelineEl = el("div", "timeline");
    const height = items.length * scale.rowHeight;
    names.style.height = height + "px";
    timelineEl.style.width = scale.width + "px";
    timelineEl.style.height = height + "px";

    const bands = document.createDocumentFragment();
    scale.cells.forEach((cell, index) => {
      if (index % 2 === 0) return;
      const band = el("div", "month-band");
      band.style.left = cell.x + "px";
      band.style.width = cell.w + "px";
      bands.appendChild(band);
    });
    timelineEl.appendChild(bands);

    const lines = document.createDocumentFragment();
    scale.cells.slice(1).forEach(cell => {
      const line = el("div", "month-line");
      line.style.left = cell.x + "px";
      lines.appendChild(line);
    });
    timelineEl.appendChild(lines);

    items.forEach((h, index) => {
      const nameRow = renderGanttNameRow(h);
      names.appendChild(nameRow);
      timelineEl.appendChild(renderGanttTrack(h, index, nameRow));
    });

    const today = todayMidnight();
    if (today >= scale.min && today <= scale.max) {
      const line = el("div", "today-line");
      line.style.left = xOf(today) + "px";
      timelineEl.appendChild(line);
    }

    body.append(names, timelineEl);
    return body;
  }

  function computeCornerWidth(availableWidth) {
    if (isMobile()) return window.innerWidth <= 359 ? 160 : 180;
    const names = ganttInner.querySelector(".names-col");
    const border = names ? parseFloat(getComputedStyle(names).borderRightWidth) || 0 : 0;
    const rowStyle = names ? getComputedStyle(names.querySelector(".name-row")) : null;
    const chrome = rowStyle
      ? (parseFloat(rowStyle.paddingLeft) || 0) + (parseFloat(rowStyle.paddingRight) || 0) + border
      : 28 + border;
    let needed = 0;
    ganttInner.querySelectorAll(".name-row .n-line").forEach(line => {
      const gap = parseFloat(getComputedStyle(line).gap) || 0;
      let width = 0;
      let children = 0;
      line.querySelectorAll(":scope > *").forEach(child => {
        width += child.scrollWidth;
        children++;
      });
      width += gap * Math.max(0, children - 1);
      needed = Math.max(needed, width);
    });
    needed += chrome;
    const cap = Math.max(320, availableWidth - 260);
    return Math.ceil(Math.max(320, Math.min(needed, cap)));
  }

  function fitChips() {
    ganttInner.querySelectorAll(".chips").forEach(chips => {
      chips.style.fontSize = "";
      const available = chips.parentElement.clientWidth;
      let natural = chips.getBoundingClientRect().width;
      if (!available || natural <= available) return;
      const base = parseFloat(getComputedStyle(chips).fontSize) || 10.5;
      let size = base;
      for (let i = 0; i < 8 && size > 7; i++) {
        size = Math.max(7, size * available / natural * 0.99);
        chips.style.fontSize = size + "px";
        natural = chips.getBoundingClientRect().width;
        if (natural <= available) break;
      }
    });
  }

  function scrollGanttToToday() {
    const cornerWidth = parseFloat(getComputedStyle(ganttWrap).getPropertyValue("--corner-w")) || 0;
    const visible = Math.max(0, ganttScroll.clientWidth - cornerWidth);
    const today = todayMidnight();
    const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
    const x = xOf(monthStart);
    const max = Math.max(0, scale.width - visible);
    ganttScroll.scrollLeft = Math.max(0, Math.min(max, x - 2));
  }

  function layoutGantt(items) {
    const availableWidth = ganttWrap.clientWidth || window.innerWidth || 1000;
    scale.rowHeight = parseFloat(getComputedStyle(ganttWrap).getPropertyValue("--row-h")) || 62;

    scale.width = 1000;
    scale.dayWidth = scale.width / scale.totalDays;
    scale.cells = buildCells();
    ganttInner.append(renderGanttHeader(), renderGanttBody(items));

    const cornerWidth = computeCornerWidth(availableWidth);
    const scrollbarWidth = ganttScroll.offsetWidth - ganttScroll.clientWidth;
    ganttWrap.style.setProperty("--corner-w", cornerWidth + "px");
    const fitWidth = Math.max(100, availableWidth - scrollbarWidth - cornerWidth);
    scale.width = isMobile()
      ? Math.max(fitWidth, Math.ceil(scale.totalDays * MIN_DAY_W_MOBILE))
      : fitWidth;
    scale.dayWidth = scale.width / scale.totalDays;
    scale.cells = buildCells();
    ganttInner.style.setProperty("--timeline-w", scale.width + "px");

    ganttInner.replaceChildren(renderGanttHeader(), renderGanttBody(items));
    fitChips();

    if (isMobile()) {
      if (!state.ganttInit) {
        state.ganttInit = true;
        scrollGanttToToday();
      }
    } else {
      state.ganttInit = false;
      ganttScroll.scrollLeft = 0;
    }
  }

  /* ==========================================================================

  function calendarBounds() {
    if (!DATASETS.event.length) return null;
    let lo = null;
    let hi = null;
    DATASETS.event.forEach(h => {
      const start = parseISO(h.start);
      const end = parseISO(h.end);
      if (!lo || start < lo) lo = start;
      if (!hi || end > hi) hi = end;
    });
    return {
      min: new Date(lo.getFullYear(), lo.getMonth(), 1),
      max: new Date(hi.getFullYear(), hi.getMonth(), 1),
    };
  }

  function calendarHeaderHeight() {
    return calDow.classList.contains("is-hidden") ? 0 : calDow.offsetHeight;
  }

  function calendarFirstCell(monthKey) {
    return calGrid.querySelector('[data-ym="' + monthKey + '"]');
  }

  function calendarMonthStart(monthKey) {
    const cell = calendarFirstCell(monthKey);
    return cell ? cell.offsetTop : null;
  }

  function scrollCalendarTo(top, smooth) {
    const target = Math.max(0, top);
    if (smooth) calendarScroll.scrollTo({ top: target, behavior: "smooth" });
    else calendarScroll.scrollTop = target;
  }

  function calendarScrollToMonth(monthKey, smooth) {
    const start = calendarMonthStart(monthKey);
    if (start == null) return false;
    scrollCalendarTo(start, smooth);
    return true;
  }

  function calendarScrollToDay(dateKey, smooth) {
    const cell = calGrid.querySelector('[data-date="' + dateKey + '"]');
    if (!cell) return false;
    const monthHeading = calGrid.querySelector(".cal-agenda-month");
    scrollCalendarTo(cell.offsetTop - (monthHeading ? monthHeading.offsetHeight : 0), smooth);
    return true;
  }

  function calendarMonthList() {
    const list = [];
    calGrid.querySelectorAll("[data-ym]").forEach(cell => {
      const monthKey = cell.dataset.ym;
      if (list[list.length - 1] !== monthKey) list.push(monthKey);
    });
    return list;
  }

  function calendarTopMonth() {
    const list = calendarMonthList();
    if (!list.length) return null;
    const edge = calendarScroll.scrollTop + calendarHeaderHeight() + 1;
    let current = list[0];
    list.forEach(monthKey => {
      const start = calendarMonthStart(monthKey);
      if (start != null && start <= edge) current = monthKey;
    });
    return current;
  }

  function shiftCalendarMonth(delta) {
    const list = calendarMonthList();
    if (!list.length) return;
    const next = list[Math.max(0, list.indexOf(calendarTopMonth())) + delta];
    if (next) calendarScrollToMonth(next, true);
  }

  function jumpToCalendarResults() {
    if (state.tab !== "event" || (!state.query && !state.fmt)) return;
    const items = state.events.filter(matches);
    if (!items.length) return;
    const first = items.reduce((a, b) => (parseISO(a.start) <= parseISO(b.start) ? a : b));
    const start = parseISO(first.start);
    const monthKey = ymOf(start);
    const dayKey = ymd(start);
    const cell = (isMobile() && calGrid.querySelector('[data-date="' + dayKey + '"]')) ||
      calendarFirstCell(monthKey);
    if (!cell) return;
    const scrollRect = calendarScroll.getBoundingClientRect();
    const cellRect = cell.getBoundingClientRect();
    const topEdge = scrollRect.top + calendarHeaderHeight();
    if (cellRect.bottom > topEdge && cellRect.top < scrollRect.bottom) return;
    if (cell.dataset.date) calendarScrollToDay(dayKey, true);
    else calendarScrollToMonth(monthKey, true);
  }

  /* ==========================================================================
     Календарь: сетка месяца и агенда
     ========================================================================== */

  function addVideoMark(btn, h) {
    if (!Array.isArray(h.links) || !h.links.some(link => link.kind === "video")) return;
    const mark = el("span", "cal-ev-video");
    mark.innerHTML = ICONS.video;
    mark.title = "Есть видео";
    mark.setAttribute("role", "img");
    mark.setAttribute("aria-label", "Есть видео");
    btn.appendChild(mark);
  }

  function calendarChip(h, options) {
    const settings = options || {};
    const format = formatOf(h);
    const className = "cal-ev" + (format ? " cal-ev--" + format.kind : "") +
      (settings.agenda ? " cal-agenda-ev" : "");
    const btn = el("button", className);
    const timeLabel = settings.timeLabel;
    if (timeLabel) btn.appendChild(el("span", "cal-ev-time", timeLabel));
    btn.appendChild(el("span", "cal-ev-name", h.name));
    if (settings.until && h.end !== h.start) {
      btn.appendChild(el("span", "cal-agenda-until", "до " + fmtDate(h.end)));
    }
    addVideoMark(btn, h);
    btn.type = "button";
    btn.title = h.name;
    bindTip(btn, h);
    btn.addEventListener("click", () => openModal(h));
    return btn;
  }

  function renderAgenda(items) {
    calGrid.replaceChildren();
    const startTimes = new Map(items.map(h => [h, startTimeOf(h)]));
    const sorted = items.slice().sort((a, b) => {
      const byDate = parseISO(a.start) - parseISO(b.start);
      if (byDate) return byDate;
      const timeA = startTimes.get(a);
      const timeB = startTimes.get(b);
      return (timeA ? timeA.minutes : 24 * 60 + 1) - (timeB ? timeB.minutes : 24 * 60 + 1);
    });
    const todayKey = ymd(todayMidnight());
    const fragment = document.createDocumentFragment();
    let currentMonth = "";
    let currentDay = "";

    sorted.forEach(h => {
      const start = parseISO(h.start);
      const monthKey = ymOf(start);
      if (monthKey !== currentMonth) {
        currentMonth = monthKey;
        currentDay = "";
        const heading = el("div", "cal-agenda-month", MONTHS_FULL[start.getMonth()] + " " + start.getFullYear());
        heading.dataset.ym = monthKey;
        fragment.appendChild(heading);
      }
      const dayKey = ymd(start);
      if (dayKey !== currentDay) {
        currentDay = dayKey;
        const heading = el("div", "cal-agenda-day" + (dayKey === todayKey ? " is-today" : ""),
          DOW_SHORT[start.getDay()] + ", " + start.getDate() + " " + MONTHS_GEN[start.getMonth()] +
          (dayKey === todayKey ? " · сегодня" : ""));
        heading.dataset.date = dayKey;
        fragment.appendChild(heading);
      }
      const time = startTimes.get(h);
      fragment.appendChild(calendarChip(h, {
        agenda: true,
        until: true,
        timeLabel: time ? time.label : "",
      }));
    });

    calGrid.appendChild(fragment);
    if (!state.calInit) {
      state.calInit = true;
      const today = todayMidnight();
      if (!calendarScrollToDay(ymd(today), false) && !calendarScrollToMonth(ymOf(today), false)) {
        const first = calGrid.querySelector("[data-ym]");
        if (first) calendarScrollToMonth(first.dataset.ym, false);
      }
    }
  }

  function renderMonthFrames(months, firstCells) {
    const frames = el("div", "cal-frames");
    const addHorizontal = (top, left, width) => {
      const line = el("div", "cal-hline");
      line.style.top = top + "px";
      line.style.left = left + "px";
      if (width == null) line.style.right = "0";
      else line.style.width = width + "px";
      frames.appendChild(line);
    };
    const addVertical = (left, top, height) => {
      const line = el("div", "cal-vline");
      line.style.left = left + "px";
      line.style.top = top + "px";
      line.style.height = height + "px";
      frames.appendChild(line);
    };

    for (let i = 0; i < months.length - 1; i++) {
      const cell = firstCells.get(months[i + 1].ym);
      if (!cell) continue;
      const rowTop = cell.offsetTop;
      const rowHeight = cell.offsetHeight;
      const stepX = cell.offsetLeft;
      const column = Number(cell.style.gridColumn) - 2;
      if (column === 0) {
        addHorizontal(rowTop, 0);
      } else {
        addHorizontal(rowTop + rowHeight, 0, stepX);
        addVertical(stepX, rowTop, rowHeight + 1);
        addHorizontal(rowTop, stepX);
      }
    }
    calGrid.appendChild(frames);
  }

  function buildCalendarGridModel(items) {
    const byDay = new Map();
    const startTimes = new Map();
    items.forEach(h => {
      startTimes.set(h, startTimeOf(h));
      const end = parseISO(h.end);
      for (const day = parseISO(h.start); day <= end; day.setDate(day.getDate() + 1)) {
        const key = ymd(day);
        if (!byDay.has(key)) byDay.set(key, []);
        byDay.get(key).push(h);
      }
    });
    byDay.forEach(list => list.sort((a, b) => {
      const timeA = startTimes.get(a);
      const timeB = startTimes.get(b);
      if (!timeA) return timeB ? 1 : 0;
      if (!timeB) return -1;
      return timeA.minutes - timeB.minutes;
    }));

    const todayTime = todayMidnight().getTime();
    const firstItem = items.reduce((a, h) => (parseISO(a.start) <= parseISO(h.start) ? a : h));
    const lastItem = items.reduce((a, h) => (parseISO(a.end) >= parseISO(h.end) ? a : h));
    const firstStart = parseISO(firstItem.start);
    const lastEnd = parseISO(lastItem.end);
    const from = new Date(firstStart.getFullYear(), firstStart.getMonth(), 1);
    const to = new Date(lastEnd.getFullYear(), lastEnd.getMonth(), 1);
    const gridStart = new Date(from.getFullYear(), from.getMonth(), 1 - ((from.getDay() + 6) % 7));
    const lastDayOfMonth = new Date(to.getFullYear(), to.getMonth() + 1, 0);
    const gridEnd = new Date(to.getFullYear(), to.getMonth(),
      lastDayOfMonth.getDate() + (6 - ((lastDayOfMonth.getDay() + 6) % 7)));
    const totalDays = Math.round((gridEnd - gridStart) / MS_DAY) + 1;
    const rows = totalDays / 7;

    const months = [];
    for (let year = from.getFullYear(), month = from.getMonth(); ; ) {
      months.push({ y: year, m: month, ym: ymOf(new Date(year, month, 1)) });
      if (year === to.getFullYear() && month === to.getMonth()) break;
      month++;
      if (month > 11) {
        month = 0;
        year++;
      }
    }
    const monthIndex = new Map(months.map((month, index) => [month.ym, index]));

    const rowMonth = [];
    for (let row = 0; row < rows; row++) {
      const date = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + row * 7);
      const monthKey = ymOf(date);
      rowMonth.push(monthIndex.has(monthKey) ? monthIndex.get(monthKey) : (row === 0 ? 0 : months.length - 1));
    }
    const labelSpan = months.map(() => null);
    rowMonth.forEach((index, row) => {
      if (!labelSpan[index]) labelSpan[index] = { r0: row, r1: row };
      else labelSpan[index].r1 = row;
    });

    return { byDay, startTimes, todayTime, gridStart, rows, months, monthIndex, labelSpan };
  }

  function renderCalendarGrid(items) {
    const { byDay, startTimes, todayTime, gridStart, rows, months, monthIndex, labelSpan } =
      buildCalendarGridModel(items);

    const fragment = document.createDocumentFragment();
    months.forEach((month, index) => {
      const span = labelSpan[index];
      const label = el("div", "cal-rail");
      label.style.gridColumn = "1";
      label.style.gridRow = (span.r0 + 1) + " / span " + (span.r1 - span.r0 + 1);
      label.appendChild(el("span", null, MONTHS_FULL[month.m] + " " + month.y));
      fragment.appendChild(label);
    });

    const firstCells = new Map();
    for (let row = 0; row < rows; row++) {
      for (let column = 0; column < 7; column++) {
        const date = new Date(gridStart.getFullYear(), gridStart.getMonth(),
          gridStart.getDate() + row * 7 + column);
        const monthKey = ymOf(date);
        const cell = el("div", "cal-day" +
          (column === 0 ? " cal-day--mon" : "") +
          (column >= 5 ? " cal-day--weekend" : ""));
        cell.style.gridColumn = String(column + 2);
        cell.style.gridRow = String(row + 1);
        if (date.getTime() === todayTime) cell.classList.add("is-today");
        cell.appendChild(el("div", "cal-day-num", String(date.getDate())));
        (byDay.get(ymd(date)) || []).forEach(h => {
          const time = startTimes.get(h);
          cell.appendChild(calendarChip(h, { timeLabel: time ? time.label : "" }));
        });
        if (monthIndex.has(monthKey) && !firstCells.has(monthKey)) {
          cell.dataset.ym = monthKey;
          firstCells.set(monthKey, cell);
        }
        fragment.appendChild(cell);
      }
    }
    calGrid.replaceChildren(fragment);
    renderMonthFrames(months, firstCells);

    if (!state.calInit) {
      state.calInit = true;
      if (!calendarScrollToMonth(ymOf(todayMidnight()), false)) {
        calendarScrollToMonth(months[0].ym, false);
      }
    }
  }

  function renderCalendarEmpty() {
    calGrid.replaceChildren();
    calGrid.classList.add("is-hidden");
    calGrid.classList.remove("cal-agenda");
    calDow.classList.add("is-hidden");
    calEmpty.replaceChildren();
    calEmpty.appendChild(el("span", null,
      state.events.length ? "Ничего не найдено" : "Нет данных о событиях"));
    if (state.events.length) {
      calEmpty.appendChild(button("link", "сбросить фильтры", resetFilters));
    }
    calEmpty.classList.add("is-active");
  }

  function renderCalendar() {
    const bounds = calendarBounds();
    if (bounds) {
      scale.min = bounds.min;
      scale.max = new Date(bounds.max.getFullYear(), bounds.max.getMonth() + 1, 0);
    }

    const items = state.events.filter(matches);
    if (!items.length) {
      renderCalendarEmpty();
      return;
    }

    calEmpty.classList.remove("is-active");
    calEmpty.replaceChildren();
    calGrid.classList.remove("is-hidden");
    calDow.classList.remove("is-hidden");

    if (isMobile()) {
      calGrid.classList.add("cal-agenda");
      calDow.classList.add("is-hidden");
      renderAgenda(items);
      return;
    }

    calGrid.classList.remove("cal-agenda");
    renderCalendarGrid(items);
  }

     Пустые состояния

  function emptyBox(text, actionLabel, onAction) {
    const box = el("div", "empty");
    box.appendChild(el("span", null, text));
    if (actionLabel) box.appendChild(button("link", actionLabel, onAction));
    return box;
  }

  function resetFilters() {
    searchInput.value = "";
    state.query = "";
    state.actual = false;
    state.signup = false;
    state.fmt = "";
    updateGroup(filterGroup, () => false, "aria-pressed");
    updateGroup(fmtGroup, btn => btn.dataset.fmt === "", "aria-pressed");
    build();
    searchInput.focus();
  }

  /* ==========================================================================
     Сборка страницы
     ========================================================================== */

  function updateSearchPlaceholder() {
    searchInput.placeholder = isMobile() ? SEARCH_PLACEHOLDER_MOBILE : SEARCH_PLACEHOLDER;
  }

  function renderGantt() {
    ganttInner.replaceChildren();

    if (!state.events.length) {
      ganttInner.appendChild(emptyBox("Нет данных о событиях"));
      return;
    }

    const base = baseEvents();
    if (!base.length) {
      ganttInner.appendChild(emptyBox(
        "Нет событий за выбранный период",
        "показать все",
        () => setRange(0)
      ));
      return;
    }

    computeRange(base);
    const items = base.filter(matches);
    if (!items.length) {
      ganttInner.appendChild(emptyBox("Ничего не найдено", "сбросить фильтры", resetFilters));
      return;
    }
    layoutGantt(items);
  }

  function build() {
    hideTip();
    updateSearchPlaceholder();

    const isCalendar = state.tab === "event";
    ganttWrap.classList.toggle("is-hidden", isCalendar);
    calendarWrap.classList.toggle("is-active", isCalendar);
    rangeGroup.classList.toggle("is-hidden", isCalendar);
    calNav.classList.toggle("is-active", isCalendar);
    fmtGroup.classList.toggle("is-active", isCalendar);
    filterGroup.classList.toggle("is-hidden", isCalendar);

    if (isCalendar) {
      renderCalendar();
      return;
    }
    renderGantt();
  }

  /* ==========================================================================
     Подсказка и карточка события
     ========================================================================== */

  function ttRow(label, value, valueClass) {
    const row = el("div", "tt-row");
    row.append(el("span", "tt-label", label), el("span", valueClass, value));
    return row;
  }

  function dateLineOf(h) {
    const wideYear = showYear();
    let line;
    if (Array.isArray(h.phases) && h.phases.length) {
      line = h.phases
        .map(phase => fmtRange(phase.start, phase.end, phase.start_approx, wideYear) +
          (phase.label ? " (" + phase.label + ")" : ""))
        .join(" · ");
    } else {
      line = h.start === h.end
        ? (h.start_approx ? "≈" : "") + fmtDate(h.start, wideYear)
        : fmtRange(h.start, h.end, h.start_approx, wideYear);
    }
    const time = timeOf(h);
    if (time) line += " · " + time;
    if (h.registration) {
      line += " · рег. " + (wideYear && h.registration_iso
        ? h.registration.split(" ")[0] + " " + fmtDate(h.registration_iso, true)
        : h.registration);
    }
    return line;
  }

  function regLineOf(h) {
    if (h.registration_iso) return "Рег. до " + fmtDate(h.registration_iso, showYear());
    if (h.registration) return "Рег. " + h.registration;
    return null;
  }

  function phaseLinesOf(h) {
    const wideYear = showYear();
    return (h.phases || []).map(phase => {
      const label = phase.label ? phase.label.charAt(0).toUpperCase() + phase.label.slice(1) : "";
      const icon = (phase.label || "").toLowerCase().includes("финал") ? "🏁" : "🎯";
      return {
        icon,
        text: (label ? label + " " : "") + fmtRange(phase.start, phase.end, phase.start_approx, wideYear),
      };
    });
  }

  function whenRow(icon, text) {
    const row = el("div", "tt-when");
    row.append(el("span", "tt-ico", icon), el("span", null, text));
    return row;
  }

  function renderTip(h) {
    tooltip.replaceChildren();
    const head = el("div", "tt-head");
    head.appendChild(el("span", "tt-name", h.name));
    tooltip.appendChild(head);

    const wideYear = showYear();
    const approx = h.start_approx ? "≈ " : "";
    const dates = h.start === h.end
      ? approx + fmtDate(h.start, wideYear)
      : approx + "С " + fmtDate(h.start, wideYear) + " по " + fmtDate(h.end, wideYear);
    tooltip.appendChild(whenRow("📅", dates));
    const time = timeOf(h);
    if (time) tooltip.appendChild(whenRow("🕒", time));
    const reg = regLineOf(h);
    if (reg) tooltip.appendChild(whenRow("⏳", reg));
    phaseLinesOf(h).forEach(phase => tooltip.appendChild(whenRow(phase.icon, phase.text)));
    tooltip.classList.remove("hidden");
  }

  function renderProgram(talks) {
    const program = el("div", "tt-program");
    const section = el("div", "tt-section");
    section.appendChild(el("span", "tt-label", "📋 Программа:"));
    program.appendChild(section);

    const list = el("ul", "tt-talks" + (talks.some(talk => talk.time) ? "" : " tt-talks--notime"));
    talks.forEach(talk => {
      const item = el("li");
      item.appendChild(el("span", "tt-talk-time", talk.time || ""));
      const body = el("span");
      if (talk.video_url && isHttp(talk.video_url)) {
        const link = externalLink(talk.video_url, "tt-talk-link", talk.title);
        link.title = "Открыть запись доклада";
        body.appendChild(link);
      } else {
        body.appendChild(el("span", null, talk.title));
      }
      item.appendChild(body);
      list.appendChild(item);
    });
    program.appendChild(list);
    return program;
  }

  function calendarExportRow(h) {
    const row = el("div", "tt-row tt-cal");
    row.appendChild(el("span", "tt-label", "📆 В календарь:"));
    row.appendChild(externalLink(
      googleCalendarUrl(h.name, h.start, h.end, detailsOf(h)),
      "tt-link",
      "Google"
    ));
    if (h.registration_iso) {
      const regText = fmtDate(h.registration_iso, showYear());
      row.appendChild(externalLink(
        googleCalendarUrl(
          h.name + " — рег. до " + regText,
          h.registration_iso,
          h.registration_iso,
          "Регистрация до " + regText + (h.url ? "\n" + h.url : "")
        ),
        "tt-link",
        "Google (рег. до " + regText + ")"
      ));
    }
    row.appendChild(button("tt-link", "Скачать .ics", () => downloadICS(h)));
    return row;
  }

  function renderFull(container, h) {
    container.replaceChildren();

    const head = el("div", "tt-head");
    const host = h.url ? hostOf(h.url) : "";
    if (host) {
      const extensions = ["png", "svg"];
      const image = el("img", "tt-fav");
      image.alt = "";
      image.addEventListener("error", () => {
        if (extensions.length) image.src = "icons/" + host + "." + extensions.shift();
        else image.remove();
      });
      image.src = "icons/" + host + "." + extensions.shift();
      head.appendChild(image);
    }
    head.appendChild(el("span", "tt-name", h.name));
    container.append(head, el("div", "tt-dates", dateLineOf(h)));

    const talks = h.talks || [];
    const columns = el("div", "tt-cols" + (talks.length ? " tt-cols--split" : ""));
    const main = el("div");
    const side = el("div", "tt-col-side tt-links");
    columns.appendChild(main);
    if (talks.length) columns.appendChild(renderProgram(talks));
    container.appendChild(columns);

    if (h.description && !talks.length) {
      main.appendChild(el("div", "tt-desc", h.description));
    }

    const tasks = h.tasks || [];
    if (tasks.length) {
      const section = el("div", "tt-section");
      section.appendChild(el("span", "tt-label", state.tab === "event" ? "🏷️ Темы:" : "🏷️ Треки:"));
      main.appendChild(section);
      const list = el("ul", "tt-list");
      tasks.forEach(task => list.appendChild(el("li", null, task)));
      main.appendChild(list);
    }

    if (h.prize) main.appendChild(ttRow("💰 Приз:", stripLabel(h.prize), "tt-prize"));
    if (h.participation) main.appendChild(ttRow("🏀 Участие:", stripLabel(h.participation)));
    if (h.format) main.appendChild(ttRow("🌐 Формат:", stripLabel(h.format)));
    if (h.lang) main.appendChild(ttRow("🖥️ Язык:", h.lang));

    if (isHttp(h.url)) {
      side.appendChild(externalLink(h.url, "tt-link tt-side-link", "🔗 Открыть страницу события"));
    }

    const links = h.links || [];
    LINK_GROUPS.forEach(group => {
      let groupLinks = links.filter(link => link.kind === group.kind);
      if (state.tab === "event" && group.kind === "video" && groupLinks.length > 1 &&
          talks.some(talk => talk.video_url)) {
        groupLinks = groupLinks.slice(0, 1);
      }
      if (!groupLinks.length) return;
      side.appendChild(el("span", "tt-label", group.label));
      const list = el("ul", "tt-list");
      groupLinks.forEach(link => {
        const anchor = externalLink(link.url, "tt-link", link.title);
        list.appendChild(el("li")).appendChild(anchor);
      });
      side.appendChild(list);
    });

    main.appendChild(calendarExportRow(h));

    if (side.childNodes.length) {
      if (!talks.length && state.tab === "comp") {
        columns.classList.add("tt-cols--side");
        columns.appendChild(side);
      } else {
        main.appendChild(side);
      }
    }
  }

  /* ==========================================================================
     Экспорт в календарь (.ics)
     ========================================================================== */

  function detailsOf(h) {
    const wideYear = showYear();
    const lines = ["Даты: " + (h.start === h.end
      ? (h.start_approx ? "≈" : "") + fmtDate(h.start, wideYear)
      : fmtRange(h.start, h.end, h.start_approx, wideYear))];
    (h.phases || []).forEach(phase => {
      lines.push((phase.label ? phase.label.charAt(0).toUpperCase() + phase.label.slice(1) + ": " : "") +
        fmtRange(phase.start, phase.end, phase.start_approx, wideYear));
    });
    if (h.time) lines.push("Время: " + h.time);
    if (h.description) lines.push(h.description);
    if (h.registration) {
      const reg = h.registration_iso ? fmtDate(h.registration_iso, wideYear) : h.registration.replace(/^до\s*/i, "");
      lines.push("Рег. до: " + reg);
    }
    if (h.prize) lines.push(stripLabel(h.prize));
    if (h.format) lines.push(stripLabel(h.format));
    if (h.url) lines.push(h.url);
    return lines.join("\n");
  }

  function googleCalendarUrl(text, start, end, details) {
    return "https://calendar.google.com/calendar/render?action=TEMPLATE" +
      "&text=" + encodeURIComponent(text) +
      "&dates=" + compactDate(start) + "/" + compactDate(addDaysISO(end, 1)) +
      (details ? "&details=" + encodeURIComponent(details) : "");
  }

  function slugify(value) {
    return value.toLowerCase().split("")
      .map(char => (TRANSLIT[char] !== undefined ? TRANSLIT[char] : char))
      .join("")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .slice(0, 60) || "event";
  }

  function icsEscape(value) {
    return String(value)
      .replace(/\\/g, "\\\\")
      .replace(/;/g, "\\;")
      .replace(/,/g, "\\,")
      .replace(/\r?\n/g, "\\n");
  }

  function icsFold(line) {
    const result = [];
    let current = "";
    let length = 0;
    for (const char of line) {
      const size = encodeURIComponent(char).replace(/%[0-9A-F]{2}/g, "x").length;
      if (length + size > 73) {
        result.push(current);
        current = " ";
        length = 1;
      }
      current += char;
      length += size;
    }
    result.push(current);
    return result.join("\r\n");
  }

  function utcStamp() {
    const date = new Date();
    return date.getUTCFullYear() + pad2(date.getUTCMonth() + 1) + pad2(date.getUTCDate()) +
      "T" + pad2(date.getUTCHours()) + pad2(date.getUTCMinutes()) + pad2(date.getUTCSeconds()) + "Z";
  }

  function buildICS(h) {
    const wideYear = showYear();
    const stamp = utcStamp();
    const uid = slugify(h.name) + "-" + compactDate(h.start);
    const lines = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//hack_calendar//events//RU",
      "CALSCALE:GREGORIAN",
      "BEGIN:VEVENT",
      "UID:" + uid + "@hack-calendar",
      "DTSTAMP:" + stamp,
      "DTSTART;VALUE=DATE:" + compactDate(h.start),
      "DTEND;VALUE=DATE:" + compactDate(addDaysISO(h.end, 1)),
      "SUMMARY:" + icsEscape(h.name),
      "DESCRIPTION:" + icsEscape(detailsOf(h)),
    ];
    if (h.url) lines.push("URL:" + h.url);
    lines.push("END:VEVENT");
    if (h.registration_iso) {
      const reg = fmtDate(h.registration_iso, wideYear);
      lines.push(
        "BEGIN:VEVENT",
        "UID:" + uid + "-reg@hack-calendar",
        "DTSTAMP:" + stamp,
        "DTSTART;VALUE=DATE:" + compactDate(h.registration_iso),
        "DTEND;VALUE=DATE:" + compactDate(addDaysISO(h.registration_iso, 1)),
        "SUMMARY:" + icsEscape(h.name + " — рег. до " + reg),
        "DESCRIPTION:" + icsEscape("Дедлайн регистрации: " + reg + (h.url ? "\n" + h.url : ""))
      );
      if (h.url) lines.push("URL:" + h.url);
      lines.push("END:VEVENT");
    }
    lines.push("END:VCALENDAR");
    return lines.map(icsFold).join("\r\n") + "\r\n";
  }

  function downloadICS(h) {
    const blob = new Blob([buildICS(h)], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = el("a");
    link.href = url;
    link.download = slugify(h.name) + ".ics";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  /* ==========================================================================
     Подсказка: позиционирование
     ========================================================================== */

  function placeTip(x, y) {
    const padding = 14;
    const margin = 8;
    const width = tooltip.offsetWidth;
    const height = tooltip.offsetHeight;
    let left = x + padding;
    let top = y + padding;
    if (left + width > window.innerWidth - margin) left = x - width - padding;
    if (top + height > window.innerHeight - margin) top = y - height - padding;
    tooltip.style.left = Math.max(margin, left) + "px";
    tooltip.style.top = Math.max(margin, top) + "px";
  }

  function showTip(e, h) {
    renderTip(h);
    placeTip(e.clientX, e.clientY);
  }

  function showTipAtRect(rect, h) {
    renderTip(h);
    placeTip(rect.right + 10, rect.top);
  }

  function moveTip(e) {
    placeTip(e.clientX, e.clientY);
  }

  function hideTip() {
    tooltip.classList.add("hidden");
  }

  function bindTip(node, h) {
    node.addEventListener("mouseenter", e => showTip(e, h));
    node.addEventListener("mousemove", moveTip);
    node.addEventListener("mouseleave", hideTip);
  }

  function bindRowHover(nameRow, track) {
    const on = () => {
      nameRow.classList.add("is-hover");
      track.classList.add("is-hover");
    };
    const off = () => {
      nameRow.classList.remove("is-hover");
      track.classList.remove("is-hover");
    };
    nameRow.addEventListener("mouseenter", on);
    nameRow.addEventListener("mouseleave", off);
    track.addEventListener("mouseenter", on);
    track.addEventListener("mouseleave", off);
  }

  /* ==========================================================================
     Модальная карточка
     ========================================================================== */

  let modalLastFocus = null;

  function openModal(h) {
    hideTip();
    modalLastFocus = document.activeElement;
    renderFull(modalContent, h);
    modalCard.classList.toggle("modal--wide", !!(h.talks && h.talks.length));
    modalCard.setAttribute("aria-label", h.name);
    modalBackdrop.classList.remove("hidden");
    modalClose.focus();
  }

  function closeModal() {
    if (modalBackdrop.classList.contains("hidden")) return;
    modalBackdrop.classList.add("hidden");
    modalContent.replaceChildren();
    if (modalLastFocus && typeof modalLastFocus.focus === "function") modalLastFocus.focus();
    modalLastFocus = null;
  }

  modalClose.addEventListener("click", closeModal);
  modalBackdrop.addEventListener("click", e => {
    if (e.target === modalBackdrop) closeModal();
  });

  /* ==========================================================================
     Форма предложения события
     ========================================================================== */

  let suggestLastFocus = null;
  let suggestCloseTimer = null;

  function setSuggestStatus(text, kind) {
    suggestStatus.textContent = text || "";
    suggestStatus.classList.toggle("is-hidden", !text);
    suggestStatus.classList.toggle("is-ok", kind === "ok");
    suggestStatus.classList.toggle("is-err", kind === "err");
  }

  function openSuggest() {
    hideTip();
    clearTimeout(suggestCloseTimer);
    suggestLastFocus = document.activeElement;
    suggestBackdrop.classList.remove("hidden");
    setSuggestStatus("", "");
    suggestDesc.focus();
  }

  function closeSuggest() {
    if (suggestBackdrop.classList.contains("hidden")) return;
    clearTimeout(suggestCloseTimer);
    suggestBackdrop.classList.add("hidden");
    suggestForm.reset();
    setSuggestStatus("", "");
    suggestSubmit.disabled = false;
    if (suggestLastFocus && typeof suggestLastFocus.focus === "function") suggestLastFocus.focus();
    suggestLastFocus = null;
  }

  function mailtoSuggest(description, link) {
    const body = "Ссылка: " + link + "\n\nОписание:\n" + description;
    const subject = encodeURIComponent("ML-Gantt: предложение события");
    window.location.href = "mailto:" + FEEDBACK_EMAIL + "?subject=" + subject + "&body=" + encodeURIComponent(body);
  }

  async function sendSuggest(description, link) {
    suggestSubmit.disabled = true;
    setSuggestStatus("Отправляем…", "");
    try {
      const response = await fetch(FEEDBACK_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          _subject: "ML-Gantt: предложение события",
          _template: "table",
          _captcha: "false",
          "Ссылка": link,
          "Описание": description,
        }),
      });
      if (!response.ok) throw new Error("HTTP " + response.status);
      setSuggestStatus("Спасибо! Предложение отправлено.", "ok");
      suggestForm.reset();
      suggestCloseTimer = setTimeout(closeSuggest, 2200);
    } catch (error) {
      setSuggestStatus("Не получилось отправить автоматически — открываю почтовый клиент…", "err");
      mailtoSuggest(description, link);
    } finally {
      suggestSubmit.disabled = false;
    }
  }

  suggestBtn.addEventListener("click", openSuggest);
  suggestClose.addEventListener("click", closeSuggest);
  suggestBackdrop.addEventListener("click", e => {
    if (e.target === suggestBackdrop) closeSuggest();
  });
  suggestForm.addEventListener("submit", e => {
    e.preventDefault();
    const description = suggestDesc.value.trim();
    const link = suggestLink.value.trim();
    if (!description && !link) {
      setSuggestStatus("Заполните хотя бы одно поле — описание или ссылка.", "err");
      suggestDesc.focus();
      return;
    }
    sendSuggest(description, link);
  });
  [suggestDesc, suggestLink].forEach(field => {
    field.addEventListener("input", () => {
      if (suggestStatus.classList.contains("is-err")) setSuggestStatus("", "");
    });
  });

  /* ==========================================================================
     Тема оформления
     ========================================================================== */

  function applyTheme(theme, persist) {
    document.documentElement.dataset.theme = theme;
    themeToggle.innerHTML = theme === "light" ? ICONS.moon : ICONS.sun;
    const label = theme === "light" ? "Включить тёмную тему" : "Включить светлую тему";
    themeToggle.setAttribute("aria-label", label);
    themeToggle.title = label;
    if (themeColor) themeColor.setAttribute("content", theme === "light" ? "#eef1f7" : "#0d1322");
    if (persist) storageSet(STORAGE_THEME, theme);
  }

  applyTheme(document.documentElement.dataset.theme === "light" ? "light" : "dark", false);
  themeToggle.addEventListener("click", () => {
    applyTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light", true);
  });

  /* ==========================================================================
     Управление: вкладки, период, фильтры, поиск
     ========================================================================== */

  function setRange(range) {
    state.range = range;
    state.ganttInit = false;
    updateGroup(rangeGroup, btn => Number(btn.dataset.range) === range, "aria-pressed");
    build();
  }

  function setFormat(format) {
    state.fmt = format;
    updateGroup(fmtGroup, btn => btn.dataset.fmt === format, "aria-pressed");
    build();
    jumpToCalendarResults();
  }

  function setTab(tab) {
    state.tab = tab;
    updateGroup(tabGroup, btn => btn.dataset.tab === tab, "aria-selected");
    storageSet(STORAGE_TAB, tab);
    ganttScroll.scrollTop = 0;
    state.ganttInit = false;
    build();
    jumpToCalendarResults();
  }

  updateGroup(tabGroup, btn => btn.dataset.tab === state.tab, "aria-selected");

  onSegmentClick(rangeGroup, btn => {
    const range = Number(btn.dataset.range);
    if (Number.isFinite(range) && range !== state.range) setRange(range);
  });

  onSegmentClick(filterGroup, btn => {
    const key = btn.dataset.filter;
    if (key !== "actual" && key !== "signup") return;
    state[key] = !state[key];
    setButtonState(btn, state[key], "aria-pressed");
    build();
    jumpToCalendarResults();
  });

  onSegmentClick(fmtGroup, btn => {
    if (btn.dataset.fmt === state.fmt) return;
    setFormat(btn.dataset.fmt);
  });

  onSegmentClick(tabGroup, btn => {
    const tab = btn.dataset.tab;
    if ((tab !== "comp" && tab !== "event") || tab === state.tab) return;
    setTab(tab);
  });

  calPrev.addEventListener("click", () => shiftCalendarMonth(-1));
  calNext.addEventListener("click", () => shiftCalendarMonth(1));
  calToday.addEventListener("click", () => {
    const today = todayMidnight();
    if (isMobile() && calendarScrollToDay(ymd(today), true)) return;
    if (!calendarScrollToMonth(ymOf(today), true)) {
      const first = calGrid.querySelector("[data-ym]");
      if (first) calendarScrollToMonth(first.dataset.ym, true);
    }
  });

  searchInput.addEventListener("input", () => {
    state.query = searchInput.value.trim().toLowerCase();
    build();
    jumpToCalendarResults();
  });

  document.addEventListener("keydown", e => {
    if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey &&
        document.activeElement !== searchInput &&
        suggestBackdrop.classList.contains("hidden")) {
      e.preventDefault();
      searchInput.focus();
      return;
    }

    if (state.tab === "event" &&
        modalBackdrop.classList.contains("hidden") &&
        suggestBackdrop.classList.contains("hidden") &&
        (e.key === "ArrowLeft" || e.key === "ArrowRight") &&
        !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
      e.preventDefault();
      shiftCalendarMonth(e.key === "ArrowLeft" ? -1 : 1);
      return;
    }

    if (e.key !== "Escape") return;

    if (!suggestBackdrop.classList.contains("hidden")) {
      closeSuggest();
      return;
    }
    if (!modalBackdrop.classList.contains("hidden")) {
      closeModal();
      return;
    }
    if (state.query) {
      searchInput.value = "";
      state.query = "";
      build();
    }
    searchInput.blur();
    hideTip();
  });

  /* ==========================================================================
     Адаптивность и запуск
     ========================================================================== */

  const mobileQuery = window.matchMedia("(max-width: " + MOBILE_MAX + "px)");
  const onBreakpoint = () => {
    state.calInit = false;
    state.ganttInit = false;
    build();
  };
  if (mobileQuery.addEventListener) mobileQuery.addEventListener("change", onBreakpoint);
  else if (mobileQuery.addListener) mobileQuery.addListener(onBreakpoint);

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    hideTip();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(build, 120);
  });

  build();
})();
</script>
</body>
</html>
