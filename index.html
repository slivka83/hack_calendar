<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1322">
<title>ML-Gantt</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="description" content="Диаграмма Ганта: ближайшие ML-соревнования, хакатоны и мероприятия. Даты, призы, форматы.">
<script>
(function () {
  try {
    var saved = localStorage.getItem("hc-theme");
    var theme = saved === "light" || saved === "dark"
      ? saved
      : (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.dataset.theme = theme;
  } catch (e) {}
})();
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1322;
    --panel: #141c2f;
    --panel-2: #1b2542;
    --border: #263154;
    --text: #e9edf8;
    --muted: #8f9cb8;
    --accent: #7c8cf5;
    --today: #ff5d5d;
    --reg: #ffd166;
    --bar-hi: #8a97ff;
    --fmt-online: #57d68a;
    --fmt-offline: #ff9a56;
    --fmt-hybrid: #b18cff;
    --scroll-thumb: #2c3a63;
    --cal-sep: #a3264a;
    --corner-w: 330px;
    --header-h: 34px;
    --row-h: 62px;
    --bar-h: 26px;
    --timeline-w: 0px;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #eef1f7;
    --panel: #ffffff;
    --panel-2: #e6eaf4;
    --border: #ccd5e8;
    --text: #1d2740;
    --muted: #5b6a8c;
    --accent: #4c5ae0;
    --today: #e03434;
    --reg: #b98a00;
    --bar-hi: #7180ef;
    --fmt-online: #1f9d57;
    --fmt-offline: #d96414;
    --fmt-hybrid: #7c50e8;
    --scroll-thumb: #b6c2de;
    --cal-sep: #801f3c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    transition: background-color .25s, color .25s;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 40%, transparent); }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
    transition: background-color .25s, border-color .25s;
  }
  .title-block { min-width: 0; }
  .topbar h1 { display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 700; letter-spacing: .2px; }
  .logo { flex: none; }

  .tabs { margin-right: auto; padding: 4px; }
  .tabs .seg-btn { font-size: 13px; padding: 5px 12px; font-weight: 600; }

  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .seg {
    display: flex;
    gap: 2px;
    padding: 3px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .seg-btn {
    appearance: none;
    background: none;
    border: 1px solid transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 7px;
    cursor: pointer;
    white-space: nowrap;
    transition: color .15s, background-color .15s, border-color .15s;
  }
  .seg-btn:hover { color: var(--text); }
  .seg-btn.is-active {
    color: var(--text);
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    border-color: color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .seg-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .seg-btn:disabled { opacity: .4; cursor: default; }
  .is-hidden { display: none !important; }

  .controls input[type="search"] {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 9px;
    padding: 7px 12px;
    width: 240px;
    font: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .controls input[type="search"]::placeholder { color: var(--muted); }
  .controls input[type="search"]:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .controls input[type="search"]:focus-visible {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  }

  .icon-btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    flex: none;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--muted);
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .icon-btn:hover { color: var(--text); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Gantt ---------- */
  .gantt-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .gantt-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
  }
  .gantt-scroll::-webkit-scrollbar { width: 10px; }
  .gantt-scroll::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 6px; border: 2px solid var(--bg); }
  .gantt-scroll::-webkit-scrollbar-track { background: transparent; }
  @supports not selector(::-webkit-scrollbar) {
    .gantt-scroll { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
  }
  .gantt-inner {
    position: relative;
    width: calc(var(--corner-w) + var(--timeline-w));
    min-height: 100%;
  }
  .gantt-header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    height: var(--header-h);
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .corner {
    position: sticky;
    left: 0;
    z-index: 30;
    flex: 0 0 var(--corner-w);
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 14px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--muted);
  }
  .months { flex: 0 0 var(--timeline-w); display: flex; }
  .month-cell {
    border-right: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .6px;
    flex: none;
    overflow: hidden;
    white-space: nowrap;
  }
  .month-cell:nth-child(even) { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .gantt-body { display: flex; align-items: flex-start; }
  .names-col {
    position: sticky;
    left: 0;
    z-index: 15;
    flex: 0 0 var(--corner-w);
    min-width: 0;
    background: var(--bg);
    border-right: 1px solid var(--border);
  }
  .timeline {
    position: relative;
    flex: 0 0 var(--timeline-w);
    isolation: isolate;
  }
  .month-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: color-mix(in srgb, var(--border) 90%, transparent);
  }
  .month-band {
    position: absolute;
    top: 0;
    bottom: 0;
    background: color-mix(in srgb, var(--accent) 5%, transparent);
  }

  .name-row {
    height: var(--row-h);
    border-bottom: 1px solid color-mix(in srgb, var(--border) 55%, transparent);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    overflow: hidden;
  }
  .name-row:hover, .name-row.is-hover { background: var(--panel-2); }

  .name-row .info {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .n-line { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .n-line .n {
    min-width: 0;
    font-size: 13.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    text-decoration: underline dashed;
    text-decoration-color: color-mix(in srgb, var(--muted) 75%, transparent);
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    transition: color .15s, text-decoration-color .15s;
  }
  .n-line .n:hover { color: var(--accent); text-decoration-color: var(--accent); }
  .src {
    flex: none;
    display: inline-flex;
    padding: 2px;
    border-radius: 5px;
    color: var(--muted);
    opacity: .55;
    transition: color .15s, opacity .15s;
  }
  .name-row:hover .src, .src:hover, .src:focus-visible { color: var(--accent); opacity: 1; }
  .src:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.src { background: none; border: none; font: inherit; cursor: pointer; }

  .chips { display: flex; flex-wrap: nowrap; gap: .38em; overflow: hidden; min-width: 0; width: max-content; font-size: 10.5px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: .476em;
    font-size: 1em;
    font-weight: 600;
    line-height: 1;
    padding: .333em .667em;
    border-radius: 999px;
    color: var(--muted);
    background: color-mix(in srgb, var(--muted) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--muted) 22%, transparent);
    white-space: nowrap;
  }
  .chip-prize {
    color: var(--reg);
    background: color-mix(in srgb, var(--reg) 10%, transparent);
    border-color: color-mix(in srgb, var(--reg) 32%, transparent);
  }
  .chip-track {
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border-color: color-mix(in srgb, var(--accent) 38%, transparent);
  }
  .chip-fmt::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--fmt); }
  .fmt-online { --fmt: var(--fmt-online); }
  .fmt-offline { --fmt: var(--fmt-offline); }
  .fmt-hybrid { --fmt: var(--fmt-hybrid); }

  /* ---------- Bars ---------- */
  .bar-track {
    position: absolute;
    height: var(--row-h);
    border-bottom: 1px solid color-mix(in srgb, var(--border) 55%, transparent);
  }
  .bar-track.is-hover { background: color-mix(in srgb, var(--panel-2) 50%, transparent); }
  .bar {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    height: var(--bar-h);
    min-width: 3px;
    border-radius: 6px;
    cursor: pointer;
    transition: filter .15s, transform .15s;
    background: var(--bar-hi);
  }
  .bar::before { content: ""; position: absolute; inset: -4px -2px; }
  .bar:hover { filter: brightness(1.2); transform: translateY(-50%) scaleY(1.12); }
  .bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .reg-mark {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    height: var(--bar-h);
    width: 2px;
    background: var(--reg);
    z-index: 5;
    cursor: help;
  }
  .reg-mark::before {
    content: "";
    position: absolute;
    top: -3px;
    left: 50%;
    width: 6px;
    height: 6px;
    transform: translateX(-50%) rotate(45deg);
    background: var(--reg);
  }
  .reg-mark::after { content: ""; position: absolute; top: 0; bottom: 0; left: -5px; right: -5px; }

  .today-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    z-index: 30;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      var(--today) 0 4px,
      transparent 4px 8px
    );
  }

  .empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--muted);
    font-size: 15px;
    z-index: 5;
    background: color-mix(in srgb, var(--bg) 70%, transparent);
  }
  .link {
    background: none;
    border: none;
    color: var(--accent);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .link:hover, .link:focus-visible { color: var(--bar-hi); }

  /* ---------- Calendar ---------- */
  .calendar-wrap { flex: 1; min-height: 0; display: none; }
  .calendar-wrap.is-active { display: flex; }
  .calendar-scroll { flex: 1; min-height: 0; overflow: auto; }
  .cal-nav { display: none; align-items: center; gap: 2px; }
  .cal-nav.is-active { display: flex; }
  .cal-nav .seg-btn { padding: 5px 10px; font-weight: 700; }
  .cal-nav #calPrev, .cal-nav #calNext { font-size: 15px; line-height: 1; padding: 2px 10px; }
  .cal-fmt { display: none; }
  .cal-fmt.is-active { display: flex; }
  .cal-fmt .seg-btn { padding: 5px 10px; display: inline-flex; align-items: center; gap: 6px; }
  .cal-fmt .seg-btn::before {
    content: "";
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--fmt-dot);
  }
  .cal-fmt .seg-btn[data-fmt="online"] { --fmt-dot: var(--fmt-online); }
  .cal-fmt .seg-btn[data-fmt="offline"] { --fmt-dot: var(--fmt-offline); }
  .cal-fmt .seg-btn[data-fmt=""]::before { display: none; }
  .cal-months {
    position: relative;
    display: grid;
    grid-template-columns: 44px repeat(7, minmax(0, 1fr));
    grid-auto-rows: minmax(96px, auto);
    background: var(--panel);
  }
  .cal-rail {
    grid-column: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 0;
    background: var(--panel-2);
    border-right: 1px solid var(--border);
  }
  .cal-rail span {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }
  .cal-frames { position: absolute; inset: 0; pointer-events: none; }
  .cal-hline, .cal-vline { position: absolute; background-color: var(--cal-sep); }
  .cal-hline { height: 1px; }
  .cal-vline { width: 1px; }
  .cal-dow-row {
    position: sticky;
    top: 0;
    z-index: 7;
    display: grid;
    grid-template-columns: 44px repeat(7, minmax(0, 1fr));
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
  }
  .cal-dow {
    padding: 8px 10px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--muted);
    text-align: center;
  }
  .cal-dow + .cal-dow { border-left: 1px solid var(--border); }
  .cal-day {
    min-height: 96px;
    min-width: 0;
    padding: 6px;
    border-top: 1px solid var(--border);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .cal-day--mon { border-left: none; }
  .cal-day--weekend { background-color: color-mix(in srgb, var(--panel) 50%, var(--bg)); }
  .cal-day.is-today {
    background-image: repeating-linear-gradient(135deg,
      color-mix(in srgb, var(--accent) 8%, transparent) 0 5px,
      transparent 5px 10px);
  }
  .cal-day.is-today .cal-day-num { color: var(--accent); font-weight: 700; }
  .cal-day-num { font-size: 11px; color: var(--muted); padding: 0 2px; }
  .cal-ev {
    --ev: var(--accent);
    appearance: none;
    display: flex;
    align-items: baseline;
    gap: 4px;
    width: 100%;
    min-width: 0;
    text-align: left;
    font: inherit;
    font-size: 11px;
    line-height: 1.3;
    padding: 3px 6px;
    border-radius: 6px;
    border: 1px solid color-mix(in srgb, var(--ev) 35%, transparent);
    border-left: 3px solid var(--ev);
    background: color-mix(in srgb, var(--ev) 12%, var(--panel));
    color: var(--text);
    cursor: pointer;
    transition: filter .15s;
  }
  .cal-ev-time {
    flex: none;
    font-variant-numeric: tabular-nums;
    padding-right: 5px;
    border-right: 1px solid color-mix(in srgb, currentColor 35%, transparent);
  }
  .cal-ev-name {
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cal-ev:hover { filter: brightness(1.15); }
  .cal-ev:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .cal-ev--online { --ev: var(--fmt-online); }
  .cal-ev--offline { --ev: var(--fmt-offline); }
  .cal-ev--hybrid { --ev: var(--fmt-hybrid); }
  .cal-empty {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 60px 0;
    color: var(--muted);
    font-size: 15px;
  }
  .cal-empty.is-active { display: flex; }

  /* ---------- Tooltip ---------- */
  .tooltip {
    position: fixed;
    z-index: 100;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    pointer-events: none;
    font-size: 13.5px;
    line-height: 1.55;
  }
  .tooltip .tt-name { font-size: 15px; }
  .tooltip.hidden { display: none; }
  .tt-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .tt-name { font-size: 14px; font-weight: 700; }
  .tt-fav { flex: none; width: 18px; height: 18px; border-radius: 4px; object-fit: contain; }
  .tt-dates { color: var(--muted); margin-bottom: 8px; font-size: 12px; }
  .tt-desc { margin: 0 0 8px; color: color-mix(in srgb, var(--text) 85%, var(--muted)); font-size: 12.5px; }
  .tt-row { margin: 4px 0; }
  .tt-label { color: var(--muted); margin-right: 6px; }
  .tt-prize { font-weight: 700; color: var(--reg); }
  .tt-section { margin: 8px 0 2px; }
  .tt-list { margin: 2px 0 8px 24px; color: color-mix(in srgb, var(--text) 82%, var(--muted)); }
  .tt-list li { margin: 3px 0; }
  .tt-talks { list-style: none; margin: 4px 0 10px; padding: 0; }
  .tt-talks li { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 0 10px; margin: 5px 0; }
  .tt-talk-time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .tt-when { color: var(--muted); margin: 3px 0; display: flex; gap: 7px; }
  .tt-when:last-child { margin-bottom: 0; }
  .tt-ico { flex: none; }
  .tt-link { color: var(--accent); text-underline-offset: 3px; }
  .tt-link:hover, .tt-link:focus-visible { color: var(--bar-hi); }
  button.tt-link { background: none; border: none; padding: 0; font: inherit; font-weight: 600; cursor: pointer; }
  .tt-cal { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 10px; }
  .tt-cal .tt-link { font-weight: 600; }
  .tt-cols { display: grid; grid-template-columns: 1fr; gap: 0; align-items: start; }
  .tt-cols--split { grid-template-columns: minmax(0, 35fr) minmax(0, 65fr); gap: 18px; }
  .tt-cols--split .tt-program { border-left: 1px solid var(--border); padding-left: 18px; }
  .tt-cols--side { grid-template-columns: minmax(0, 1fr) minmax(200px, 300px); gap: 18px; }
  .tt-cols--side .tt-col-side { margin-top: 0; border-left: 1px solid var(--border); padding-left: 18px; }
  .tt-program { min-width: 0; }
  .tt-col-side { margin-top: 10px; }
  .tt-links .tt-label { display: block; margin: 8px 0 2px; }
  .tt-links .tt-label:first-child { margin-top: 0; }
  .tt-links .tt-list { margin: 0 0 0 20px; }
  .tt-side-link { display: inline-block; margin: 2px 0 6px; font-weight: 600; }
  @media (max-width: 700px) {
    .tt-cols--side { grid-template-columns: 1fr; gap: 0; }
    .tt-cols--side .tt-col-side { border-left: none; padding-left: 0; border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; }
  }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(4, 8, 18, .55);
  }
  .modal-backdrop.hidden { display: none; }
  .modal {
    position: relative;
    width: min(640px, 100%);
    max-height: min(80vh, 720px);
    overflow: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    font-size: 13px;
    line-height: 1.5;
  }
  .modal .tt-head { padding-right: 30px; }
  .modal--wide { width: min(1000px, 100%); }
  .modal-close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 30px;
    height: 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font: inherit;
    font-size: 18px;
    line-height: 1;
    color: var(--muted);
    background: none;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .modal-close:hover { color: var(--text); background: var(--panel-2); }
  .modal-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  @media (max-width: 900px) {
    :root { --corner-w: 300px; }
  }
  @media (max-width: 600px) {
    :root { --corner-w: 200px; --row-h: 56px; }
    .chips { display: none; }
    .topbar { padding: 10px 12px; gap: 12px; }
    .controls { width: 100%; }
    .controls input[type="search"] { width: 100%; }
    .cal-dow { padding: 6px 4px; font-size: 10px; }
    .cal-day { min-height: 64px; padding: 3px; }
    .cal-months { grid-template-columns: 32px repeat(7, minmax(0, 1fr)); grid-auto-rows: minmax(64px, 1fr); }
    .cal-rail { padding: 8px 0; }
    .cal-rail span { font-size: 11px; }
    .cal-dow-row { grid-template-columns: 32px repeat(7, minmax(0, 1fr)); }
    .cal-ev { font-size: 10px; padding: 2px 4px; border-left-width: 2px; }
    .cal-title { min-width: 104px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<body>

  <div class="title-block">

      <button type="button" class="seg-btn" data-fmt="offline" aria-pressed="false" title="Офлайн-мероприятия (включая гибридные)">Офлайн</button>

<script src="data.js"></script>
<script>
(function () {
  "use strict";

  const MS_DAY = 86400000;
  const MONTHS = ["Янв", "Фев", "Мар", "Апр", "Май", "Июн", "Июл", "Авг", "Сен", "Окт", "Ноя", "Дек"];
  const MONTHS_FULL = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь",
    "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
  const fmtCls = h => {
    const f = (h.format || "").toLowerCase();
    const online = f.includes("онлайн");
    const offline = f.includes("офлайн") || f.includes("оффлайн");
    if (online && offline) return "hybrid";
    if (online) return "online";
    if (offline) return "offline";
    return "";
  };
  const LINK_SVG = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>';
  const CAL_SVG = '<svg viewBox="0 0 48 48" width="10" height="10" fill="currentColor" aria-hidden="true"><path d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
  const ICS_SVG = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="M12 13v4.5"/><path d="m9.8 15.3 2.2 2.2 2.2-2.2"/></svg>';
  const SUN_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
  const MOON_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

  const ganttWrap = document.getElementById("ganttWrap");
  const ganttScroll = ganttWrap.querySelector(".gantt-scroll");
  const ganttInner = document.getElementById("ganttInner");
  const calendarWrap = document.getElementById("calendarWrap");
  const calendarScroll = document.getElementById("calendarScroll");
  const calNav = document.getElementById("calNav");
  const calGrid = document.getElementById("calGrid");
  const calDow = document.getElementById("calDow");
  const calEmpty = document.getElementById("calEmpty");
  const calPrev = document.getElementById("calPrev");
  const calNext = document.getElementById("calNext");
  const calToday = document.getElementById("calToday");
  const tooltip = document.getElementById("tooltip");
  const modalBackdrop = document.getElementById("modalBackdrop");
  const modalCard = document.getElementById("modalCard");
  const modalContent = document.getElementById("modalContent");
  const modalClose = document.getElementById("modalClose");
  const searchInput = document.getElementById("search");
  const rangeGroup = document.getElementById("rangeGroup");
  const filterGroup = document.getElementById("filterGroup");
  const fmtGroup = document.getElementById("fmtGroup");
  const tabGroup = document.getElementById("tabGroup");
  const themeToggle = document.getElementById("themeToggle");
  const themeColor = document.querySelector('meta[name="theme-color"]');

  let DAY_W = 4;
  let ROW_H = 62;

  const DATASETS = {
    comp: (typeof HACKS !== "undefined" && Array.isArray(HACKS)
      ? HACKS.filter(h => h && h.start && h.end)
      : []).reverse(),
    event: (typeof MEETUPS !== "undefined" && Array.isArray(MEETUPS)
      ? MEETUPS.filter(h => h && h.start && h.end)
      : []),
  };

  const state = { query: "", range: 6, actual: false, signup: false, fmt: "", tab: "comp", calInit: false };
  try {
    const savedTab = localStorage.getItem("hc-tab");
    if (savedTab === "event" || savedTab === "comp") state.tab = savedTab;
  } catch (e) {}
  let EVENTS = DATASETS[state.tab];
  tabGroup.querySelectorAll(".seg-btn").forEach(btn => {
    const active = btn.dataset.tab === state.tab;
    btn.classList.toggle("is-active", active);
    btn.setAttribute("aria-selected", String(active));
  });
  let MIN, MAX, TOTAL_DAYS, TIMELINE_W;
  let CELLS = [];

  /* ---------- helpers ---------- */
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  };
  const parseISO = iso => {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d);
  };
  const fmtDate = (iso, withYear) => {
    const parts = iso.split("-");
    return Number(parts[2]) + "." + parts[1] + (withYear ? "." + parts[0] : "");
  };
  const fmtRange = (start, end, approx, withYear) =>
    (approx ? "≈" : "") + fmtDate(start, withYear) + " – " + fmtDate(end, withYear);
  const stripLabel = s => s.replace(/^(Приз(?:ы)?|Участие|Формат):\s*/, "");
  const hostOf = url => {
    try { return new URL(url).hostname; } catch (e) { return ""; }
  };

  /* ---------- chips ---------- */
  function trackTags(h) {
    const seen = new Set();
    const tags = [];
    (h.tasks || []).forEach(t => {
      const m = t.match(/^\[([^\]]+)\]/);
      if (!m) return;
      m[1].split(/[,/]+/).forEach(part => {
        const tag = part.trim().toUpperCase();
        if (tag && !seen.has(tag)) { seen.add(tag); tags.push(tag); }
      });
    });
    return tags;
  }
  const MONEY_RE = /([\d][\d\s\u00a0]*?)\s*(т\.?\s*р\.?|тыс\.?\s*(?:руб\.?|р\.?)?|млн\.?\s*(?:руб\.?|р\.?)?|млрд\.?\s*(?:руб\.?|р\.?)?|миллион(?:а|ов)?|руб(?:лей|ля|\.)?|р\.?|₽|\$|€)/gi;
  const MONEY_UNITS = [
    [/^млрд/, 1e9, "₽"],
    [/^млн|^миллион/, 1e6, "₽"],
    [/^тыс|^т$|^т\./, 1e3, "₽"],
    [/^\$/, 1, "$"],
    [/^€/, 1, "€"],
  ];
  function moneyUnit(unit) {
    const s = unit.toLowerCase();
    for (const [re, mult, cur] of MONEY_UNITS) {
      if (re.test(s)) return { mult, cur };
    }
    return { mult: 1, cur: "₽" };
  }
  function moneyTotal(text) {
    let total = 0, cur = null;
    for (const m of text.matchAll(MONEY_RE)) {
      const unit = moneyUnit(m[2].trim());
      if (cur && unit.cur !== cur) continue;
      cur = cur || unit.cur;
      total += parseInt(m[1].replace(/[\s\u00a0]/g, ""), 10) * unit.mult;
    }
    if (cur == null) return null;
    return String(total).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " " + cur;
  }
  function prizeChip(h) {
    if (!h.prize) return null;
    return moneyTotal(stripLabel(h.prize));
  }
  function formatChip(h) {
    if (!h.format) return null;
    const f = h.format;
    const online = /онлайн|kaggle/i.test(f);
    const offline = /офлайн|очно|финал[а-яё]*\s+в/i.test(f);
    if (/гибрид/i.test(f) || (online && offline)) return { cat: "гибрид", cls: "fmt-hybrid" };
    if (online) return { cat: "онлайн", cls: "fmt-online" };
    if (offline) return { cat: "офлайн", cls: "fmt-offline" };
    return null;
  }
  function participationChip(h) {
    if (!h.participation) return null;
    const p = h.participation;
    const solo = /соло/i.test(p);
    const team = /команд/i.test(p);
    if (solo && team) return "соло/команда";
    if (solo) return "соло";
    if (team) return "команда";
    return null;
  }

  /* ---------- data ---------- */
  function segmentsOf(h) {
    if (Array.isArray(h.phases) && h.phases.length) {
      return h.phases.map(p => ({ start: p.start, end: p.end }));
    }
    return [{ start: h.start, end: h.end }];
  }

  function regDeadline(h) {
    if (h.registration_iso) return parseISO(h.registration_iso);
    if (!h.registration || !h.registration.startsWith("до ")) return null;
    const m = h.registration.match(/^до (\d{1,2})\.(\d{1,2})$/);
    if (!m) return null;
    const month = Number(m[2]), day = Number(m[1]);
    const start = parseISO(h.start);
    let best = null;
    for (const year of [start.getFullYear() - 1, start.getFullYear(), start.getFullYear() + 1]) {
      const d = new Date(year, month - 1, day);
      if (d >= MIN && d <= MAX) return d;
      if (!best || Math.abs(d - start) < Math.abs(best - start)) best = d;
    }
    return best;
  }

  function dataMaxDate() {
    let max = -Infinity;
    EVENTS.forEach(h => {
      max = Math.max(max, parseISO(h.start).getTime(), parseISO(h.end).getTime());
      (h.phases || []).forEach(p => {
        max = Math.max(max, parseISO(p.start).getTime(), parseISO(p.end).getTime());
      });
    });
    return new Date(max);
  }

  function rangeWindow() {
    if (!state.range) return null;
    const last = dataMaxDate();
    return {
      from: new Date(last.getFullYear(), last.getMonth() - (state.range - 1), 1),
      to: new Date(last.getFullYear(), last.getMonth() + 1, 0),
    };
  }

  function baseEvents() {
    const w = rangeWindow();
    if (!w) return EVENTS;
    return EVENTS.filter(h => {
      const dates = [parseISO(h.start), parseISO(h.end)];
      (h.phases || []).forEach(p => dates.push(parseISO(p.start), parseISO(p.end)));
      return dates.every(d => d >= w.from && d <= w.to);
    });
  }

  function computeRange(base) {
    if (!base.length) return false;
    const stamps = [];
    base.forEach(h => {
      stamps.push(parseISO(h.start), parseISO(h.end));
      (h.phases || []).forEach(p => stamps.push(parseISO(p.start), parseISO(p.end)));
    });
    let lo = Math.min.apply(null, stamps);
    let hi = Math.max.apply(null, stamps);
    const w = rangeWindow();
    if (w) {
      lo = w.from.getTime();
      hi = w.to.getTime();
    }
    const loDate = new Date(lo), hiDate = new Date(hi);
    const months = (hiDate.getFullYear() - loDate.getFullYear()) * 12 +
                   (hiDate.getMonth() - loDate.getMonth()) + 1;
    if (months > 12) {
      MIN = new Date(loDate.getFullYear(), 0, 1);
      MAX = new Date(hiDate.getFullYear(), 11, 31);
    } else {
      MIN = new Date(loDate.getFullYear(), loDate.getMonth(), 1);
      MAX = new Date(hiDate.getFullYear(), hiDate.getMonth() + 1, 0);
    }
    TOTAL_DAYS = Math.round((MAX - MIN) / MS_DAY) + 1;
    return true;
  }

  function todayMidnight() {
    const n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }

  function isActual(h) {
    const dates = [parseISO(h.start), parseISO(h.end)];
    (h.phases || []).forEach(p => dates.push(parseISO(p.start), parseISO(p.end)));
    let hi = dates[0];
    dates.forEach(d => { if (d > hi) hi = d; });
    return todayMidnight() <= hi;
  }

  function canSignup(h) {
    const deadline = h.registration_iso ? parseISO(h.registration_iso) : parseISO(h.end);
    return todayMidnight() <= deadline;
  }

  function matches(h) {
    if (state.tab === "comp") {
      if (state.actual && !isActual(h)) return false;
      if (state.signup && !canSignup(h)) return false;
    } else if (state.fmt) {
      const f = fmtCls(h);
      if (f !== state.fmt && f !== "hybrid") return false;
    }
    if (!state.query) return true;
    return h.name.toLowerCase().includes(state.query) ||
           (h.type || "").toLowerCase().includes(state.query) ||
           (h.description || "").toLowerCase().includes(state.query) ||
           (h.tasks || []).some(t => t.toLowerCase().includes(state.query));
  }

  /* ---------- render ---------- */
  function useYears() {
    let months = 0;
    let m = new Date(MIN.getFullYear(), MIN.getMonth(), 1);
    while (m <= MAX) {
      months++;
      m = new Date(m.getFullYear(), m.getMonth() + 1, 1);
    }
    return months > 12 || DAY_W * 28 < 36;
  }

  function buildCells() {
    const cells = [];
    if (useYears()) {
      let x = 0;
      for (let y = MIN.getFullYear(); y <= MAX.getFullYear(); y++) {
        const from = new Date(Math.max(new Date(y, 0, 1).getTime(), MIN.getTime()));
        const to = new Date(Math.min(new Date(y + 1, 0, 1).getTime(), MAX.getTime() + MS_DAY));
        const w = (to - from) / MS_DAY / TOTAL_DAYS * TIMELINE_W;
        cells.push({ from: from, to: to, x: x, w: w, label: String(y) });
        x += w;
      }
    } else {
      let m = new Date(MIN.getFullYear(), MIN.getMonth(), 1);
      while (m <= MAX) {
        const next = new Date(m.getFullYear(), m.getMonth() + 1, 1);
        cells.push({
          from: m,
          to: next,
          x: Math.round((m - MIN) / MS_DAY) * DAY_W,
          w: Math.round((next - m) / MS_DAY) * DAY_W,
          label: MONTHS[m.getMonth()] + " " + String(m.getFullYear()).slice(2),
        });
        m = next;
      }
    }
    return cells;
  }

  function xOf(date) {
    if (!CELLS.length) return 0;
    const t = date.getTime();
    if (t <= CELLS[0].from.getTime()) return CELLS[0].x;
    const last = CELLS[CELLS.length - 1];
    if (t >= last.to.getTime()) return last.x + last.w;
    for (const c of CELLS) {
      if (t >= c.from.getTime() && t < c.to.getTime()) {
        return c.x + (t - c.from.getTime()) / (c.to.getTime() - c.from.getTime()) * c.w;
      }
    }
    return last.x + last.w;
  }

  function renderHeader() {
    const header = el("div", "gantt-header");
    const corner = el("div", "corner", "Событие");
    const months = el("div", "months");
    CELLS.forEach(c => {
      const cell = el("div", "month-cell", c.label);
      cell.style.width = c.w + "px";
      months.appendChild(cell);
    });
    header.append(corner, months);
    return header;
  }

  function renderChips(h) {
    const chips = el("div", "chips");
    trackTags(h).forEach(t => chips.appendChild(el("span", "chip chip-track", t)));
    const prize = prizeChip(h);
    if (prize) chips.appendChild(el("span", "chip chip-prize", prize));
    const fmt = formatChip(h);
    if (fmt) chips.appendChild(el("span", "chip chip-fmt " + fmt.cls, fmt.cat));
    const part = participationChip(h);
    if (part) chips.appendChild(el("span", "chip", part));
    return chips.childElementCount ? chips : null;
  }

  function computeCornerWidth(availW) {
    if (window.innerWidth <= 600) return 200;
    const names = ganttInner.querySelector(".names-col");
    const border = names ? parseFloat(getComputedStyle(names).borderRightWidth) || 0 : 0;
    const cs = names ? getComputedStyle(names.querySelector(".name-row")) : null;
    const chrome = cs
      ? (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0) + border
      : 28 + border;
    let needed = 0;
    ganttInner.querySelectorAll(".name-row .n-line").forEach(line => {
      const gap = parseFloat(getComputedStyle(line).gap) || 0;
      let w = 0, children = 0;
      line.querySelectorAll(":scope > *").forEach(child => {
        w += child.scrollWidth;
        children++;
      });
      w += gap * Math.max(0, children - 1);
      needed = Math.max(needed, w);
    });
    needed += chrome;
    const cap = Math.max(320, availW - 260);
    return Math.ceil(Math.max(320, Math.min(needed, cap)));
  }

  function fitChips() {
    ganttInner.querySelectorAll(".chips").forEach(chips => {
      chips.style.fontSize = "";
      const avail = chips.parentElement.clientWidth;
      let natural = chips.getBoundingClientRect().width;
      if (!avail || natural <= avail) return;
      const base = parseFloat(getComputedStyle(chips).fontSize) || 10.5;
      let size = base;
      for (let i = 0; i < 8 && size > 7; i++) {
        size = Math.max(7, size * avail / natural * 0.99);
        chips.style.fontSize = size + "px";
        natural = chips.getBoundingClientRect().width;
        if (natural <= avail) break;
      }
    });
  }

  function bindRowHover(nameRow, track) {
    const on = () => { nameRow.classList.add("is-hover"); track.classList.add("is-hover"); };
    const off = () => { nameRow.classList.remove("is-hover"); track.classList.remove("is-hover"); };
    nameRow.addEventListener("mouseenter", on);
    nameRow.addEventListener("mouseleave", off);
    track.addEventListener("mouseenter", on);
    track.addEventListener("mouseleave", off);
  }

  function bindTip(node, h) {
    node.addEventListener("mouseenter", e => showTip(e, h));
    node.addEventListener("mousemove", moveTip);
    node.addEventListener("mouseleave", hideTip);
  }

  function renderBody(items) {
    const body = el("div", "gantt-body");
    const names = el("div", "names-col");
    const timeline = el("div", "timeline");
    const rowsH = items.length * ROW_H;
    names.style.height = rowsH + "px";
    timeline.style.width = TIMELINE_W + "px";
    timeline.style.height = rowsH + "px";

    const bands = document.createDocumentFragment();
    CELLS.forEach((c, i) => {
      if (i % 2 === 0) return;
      const band = el("div", "month-band");
      band.style.left = c.x + "px";
      band.style.width = c.w + "px";
      bands.appendChild(band);
    });
    timeline.appendChild(bands);

    const lines = document.createDocumentFragment();
    CELLS.slice(1).forEach(c => {
      const line = el("div", "month-line");
      line.style.left = c.x + "px";
      lines.appendChild(line);
    });
    timeline.appendChild(lines);

    items.forEach((h, i) => {
      const nameRow = el("div", "name-row");
      const info = el("div", "info");
      const line = el("div", "n-line");
      const nameEl = el("span", "n", h.name);
      nameEl.title = h.name;
      line.appendChild(nameEl);
      if (h.url && /^https?:\/\//i.test(h.url)) {
        const src = el("a", "src");
        src.href = h.url;
        src.target = "_blank";
        src.rel = "noopener noreferrer";
        src.setAttribute("aria-label", "Страница события: " + h.name);
        src.innerHTML = LINK_SVG;
        line.appendChild(src);
      }
      const gcal = el("a", "src");
      gcal.href = googleUrl(h.name, h.start, h.end, detailsOf(h));
      gcal.target = "_blank";
      gcal.rel = "noopener noreferrer";
      gcal.setAttribute("aria-label", "Добавить в Google Календарь: " + h.name);
      gcal.title = "Добавить в Google Календарь";
      gcal.innerHTML = CAL_SVG;
      line.appendChild(gcal);

      const icsBtn = el("button", "src");
      icsBtn.type = "button";
      icsBtn.setAttribute("aria-label", "Скачать .ics: " + h.name);
      icsBtn.title = "Скачать .ics";
      icsBtn.innerHTML = ICS_SVG;
      icsBtn.addEventListener("click", () => downloadICS(h));
      line.appendChild(icsBtn);
      info.appendChild(line);
      const chips = renderChips(h);
      if (chips) info.appendChild(chips);
      nameEl.addEventListener("click", () => openModal(h));
      nameRow.appendChild(info);
      names.appendChild(nameRow);

      const track = el("div", "bar-track");
      track.style.top = i * ROW_H + "px";
      track.style.width = TIMELINE_W + "px";
      bindRowHover(nameRow, track);

      for (const seg of segmentsOf(h)) {
        const x0 = xOf(parseISO(seg.start));
        const x1 = xOf(new Date(parseISO(seg.end).getTime() + MS_DAY));
        const w = x1 - x0;
        if (w <= 0) continue;
        const bar = el("div", "bar");
        bar.style.left = x0 + "px";
        bar.style.width = w + "px";
        bar.tabIndex = 0;
        bar.setAttribute("aria-label", h.name);
        bindTip(bar, h);
        bar.addEventListener("click", () => openModal(h));
        bar.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openModal(h);
          }
        });
        bar.addEventListener("focus", () => showTipAtRect(bar.getBoundingClientRect(), h));
        bar.addEventListener("blur", hideTip);
        track.appendChild(bar);
      }

      const reg = regDeadline(h);
      if (reg) {
        const x = xOf(reg);
        if (x >= 0 && x <= TIMELINE_W) {
          const mk = el("div", "reg-mark");
          mk.style.left = x + "px";
          mk.setAttribute("aria-label", "Регистрация: " + h.registration);
          bindTip(mk, h);
          mk.addEventListener("click", () => openModal(h));
          track.appendChild(mk);
        }
      }
      timeline.appendChild(track);
    });

    const today = todayMidnight();
    if (today >= MIN && today <= MAX) {
      const line = el("div", "today-line");
      line.style.left = xOf(today) + "px";
      timeline.appendChild(line);
    }

    body.append(names, timeline);
    return body;
  }

  function resetFilters() {
    searchInput.value = "";
    state.query = "";
    state.actual = false;
    state.signup = false;
    state.fmt = "";
    filterGroup.querySelectorAll(".seg-btn").forEach(btn => {
      btn.classList.remove("is-active");
      btn.setAttribute("aria-pressed", "false");
    });
    fmtGroup.querySelectorAll(".seg-btn").forEach(btn => {
      const active = btn.dataset.fmt === "";
      btn.classList.toggle("is-active", active);
      btn.setAttribute("aria-pressed", String(active));
    });
    build();
    searchInput.focus();
  }

  /* ---------- calendar ---------- */
  function calBounds() {
    if (!DATASETS.event.length) return null;
    let lo = null, hi = null;
    DATASETS.event.forEach(h => {
      const s = parseISO(h.start), e = parseISO(h.end);
      if (!lo || s < lo) lo = s;
      if (!hi || e > hi) hi = e;
    });
    return {
      min: new Date(lo.getFullYear(), lo.getMonth(), 1),
      max: new Date(hi.getFullYear(), hi.getMonth(), 1),
    };
  }

  const ymd = d => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  const ymOf = d => d.getFullYear() + "-" + pad2(d.getMonth() + 1);

  function calHeaderH() {
    return calDow.classList.contains("is-hidden") ? 0 : calDow.offsetHeight;
  }

  function calFirstCell(ym) {
    return calGrid.querySelector('.cal-day[data-ym="' + ym + '"]');
  }

  function calMonthStart(ym) {
    const cell = calFirstCell(ym);
    return cell ? cell.offsetTop : null;
  }

  function calScrollToMonth(ym, smooth) {
    const start = calMonthStart(ym);
    if (start == null) return false;
    const top = Math.max(0, start);
    if (smooth) calendarScroll.scrollTo({ top, behavior: "smooth" });
    else calendarScroll.scrollTop = top;
    return true;
  }

  function calMonthList() {
    const list = [];
    calGrid.querySelectorAll(".cal-day[data-ym]").forEach(c => {
      const ym = c.dataset.ym;
      if (list[list.length - 1] !== ym) list.push(ym);
    });
    return list;
  }

  function calTopMonth() {
    const list = calMonthList();
    if (!list.length) return null;
    const edge = calendarScroll.scrollTop + calHeaderH() + 1;
    let cur = list[0];
    list.forEach(ym => {
      const start = calMonthStart(ym);
      if (start != null && start <= edge) cur = ym;
    });
    return cur;
  }

  function calShift(delta) {
    const list = calMonthList();
    if (!list.length) return;
    const next = list[Math.max(0, list.indexOf(calTopMonth())) + delta];
    if (next) calScrollToMonth(next, true);
  }

  function calJumpToResults() {
    if (state.tab !== "event") return;
    const items = EVENTS.filter(matches);
    if (!items.length) return;
    const h = items.reduce((a, b) => (parseISO(a.start) <= parseISO(b.start) ? a : b));
    const ym = ymOf(parseISO(h.start));
    const cell = calFirstCell(ym);
    if (!cell) return;
    const scRect = calendarScroll.getBoundingClientRect();
    const cRect = cell.getBoundingClientRect();
    const topEdge = scRect.top + calHeaderH();
    if (cRect.bottom > topEdge && cRect.top < scRect.bottom) return;
    calScrollToMonth(ym, true);
  }

  function buildCalendar() {
    const b = calBounds();
    if (b) {
      MIN = b.min;
      MAX = new Date(b.max.getFullYear(), b.max.getMonth() + 1, 0);
    }

    const items = EVENTS.filter(matches);
    if (!items.length) {
      calGrid.replaceChildren();
      calGrid.classList.add("is-hidden");
      calDow.classList.add("is-hidden");
      calEmpty.replaceChildren();
      calEmpty.appendChild(el("span", null,
        EVENTS.length ? "Ничего не найдено" : "Нет данных о событиях"));
      if (EVENTS.length) {
        const reset = el("button", "link", "сбросить фильтры");
        reset.type = "button";
        reset.addEventListener("click", resetFilters);
        calEmpty.appendChild(reset);
      }
      calEmpty.classList.add("is-active");
      return;
    }
    calEmpty.classList.remove("is-active");
    calEmpty.replaceChildren();
    calGrid.classList.remove("is-hidden");
    calDow.classList.remove("is-hidden");

    const byDay = new Map();
    const startInfo = new Map();
    items.forEach(h => {
      const t = (timeOf(h) || "").match(/(\d{1,2}):(\d{2})/);
      startInfo.set(h, t ? { label: t[0], min: +t[1] * 60 + +t[2] } : null);
      const end = parseISO(h.end);
      for (const d = parseISO(h.start); d <= end; d.setDate(d.getDate() + 1)) {
        const key = ymd(d);
        if (!byDay.has(key)) byDay.set(key, []);
        byDay.get(key).push(h);
      }
    });
    byDay.forEach(arr => arr.sort((a, b) => {
      const sa = startInfo.get(a), sb = startInfo.get(b);
      if (!sa) return sb ? 1 : 0;
      if (!sb) return -1;
      return sa.min - sb.min;
    }));

    const today = todayMidnight().getTime();
    const firstItem = items.reduce((a, h) => (parseISO(a.start) <= parseISO(h.start) ? a : h));
    const lastItem = items.reduce((a, h) => (parseISO(a.end) >= parseISO(h.end) ? a : h));
    const fromS = parseISO(firstItem.start);
    const toE = parseISO(lastItem.end);
    const from = new Date(fromS.getFullYear(), fromS.getMonth(), 1);
    const to = new Date(toE.getFullYear(), toE.getMonth(), 1);
    const gridStart = new Date(from.getFullYear(), from.getMonth(), 1 - ((from.getDay() + 6) % 7));
    const toLast = new Date(to.getFullYear(), to.getMonth() + 1, 0);
    const gridEnd = new Date(to.getFullYear(), to.getMonth(), toLast.getDate() + (6 - ((toLast.getDay() + 6) % 7)));
    const totalDays = Math.round((gridEnd - gridStart) / MS_DAY) + 1;
    const rows = totalDays / 7;

    const months = [];
    for (let y = from.getFullYear(), m = from.getMonth(); ; ) {
      months.push({ y: y, m: m, ym: ymOf(new Date(y, m, 1)) });
      if (y === to.getFullYear() && m === to.getMonth()) break;
      m++;
      if (m > 11) { m = 0; y++; }
    }
    const monthIdx = new Map(months.map((mo, i) => [mo.ym, i]));

    const rowMonth = [];
    for (let r = 0; r < rows; r++) {
      const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + r * 7);
      const ym = ymOf(d);
      rowMonth.push(monthIdx.has(ym) ? monthIdx.get(ym)
        : (r === 0 ? 0 : months.length - 1));
    }
    const labelSpan = months.map(() => null);
    rowMonth.forEach((mi, r) => {
      if (!labelSpan[mi]) labelSpan[mi] = { r0: r, r1: r };
      else labelSpan[mi].r1 = r;
    });

    const frag = document.createDocumentFragment();
    months.forEach((mo, i) => {
      const sp = labelSpan[i];
      const label = el("div", "cal-rail");
      label.style.gridColumn = "1";
      label.style.gridRow = (sp.r0 + 1) + " / span " + (sp.r1 - sp.r0 + 1);
      label.appendChild(el("span", null, MONTHS_FULL[mo.m] + " " + mo.y));
      frag.appendChild(label);
    });

    const firstCells = new Map();
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < 7; c++) {
        const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + r * 7 + c);
        const ym = ymOf(d);
        const cell = el("div", "cal-day" + (c === 0 ? " cal-day--mon" : "") + (c >= 5 ? " cal-day--weekend" : ""));
        cell.style.gridColumn = String(c + 2);
        cell.style.gridRow = String(r + 1);
        if (d.getTime() === today) cell.classList.add("is-today");
        cell.appendChild(el("div", "cal-day-num", String(d.getDate())));
        (byDay.get(ymd(d)) || []).forEach(h => {
          const fmt = fmtCls(h);
          const btn = el("button", "cal-ev" + (fmt ? " cal-ev--" + fmt : ""));
          const si = startInfo.get(h);
          if (si && ymd(d) === h.start) btn.appendChild(el("span", "cal-ev-time", si.label));
          btn.appendChild(el("span", "cal-ev-name", h.name));
          btn.type = "button";
          btn.title = h.name;
          bindTip(btn, h);
          btn.addEventListener("click", () => openModal(h));
          cell.appendChild(btn);
        });
        if (monthIdx.has(ym) && !firstCells.has(ym)) {
          cell.dataset.ym = ym;
          firstCells.set(ym, cell);
        }
        frag.appendChild(cell);
      }
    }
    calGrid.replaceChildren(frag);

    const frames = el("div", "cal-frames");
    const addH = (top, left, width) => {
      const n = el("div", "cal-hline");
      n.style.top = top + "px";
      n.style.left = left + "px";
      if (width == null) n.style.right = "0";
      else n.style.width = width + "px";
      frames.appendChild(n);
    };
    const addV = (left, top, height) => {
      const n = el("div", "cal-vline");
      n.style.left = left + "px";
      n.style.top = top + "px";
      if (height == null) n.style.bottom = "0";
      else n.style.height = height + "px";
      frames.appendChild(n);
    };
    for (let i = 0; i < months.length - 1; i++) {
      const cell = firstCells.get(months[i + 1].ym);
      if (!cell) continue;
      const rowTop = cell.offsetTop;
      const rowH = cell.offsetHeight;
      const stepX = cell.offsetLeft;
      const c1 = Number(cell.style.gridColumn) - 2;
      if (c1 === 0) {
        addH(rowTop, 0);
      } else {
        addH(rowTop + rowH, 0, stepX);
        addV(stepX, rowTop, rowH + 1);
        addH(rowTop, stepX);
      }
    }
    calGrid.appendChild(frames);

    if (!state.calInit) {
      state.calInit = true;
      if (!calScrollToMonth(ymOf(todayMidnight()), false)) {
        calScrollToMonth(months[0].ym, false);
      }
    }
  }

  function build() {
    hideTip();
    const isCal = state.tab === "event";
    ganttWrap.classList.toggle("is-hidden", isCal);
    calendarWrap.classList.toggle("is-active", isCal);
    rangeGroup.classList.toggle("is-hidden", isCal);
    calNav.classList.toggle("is-active", isCal);
    fmtGroup.classList.toggle("is-active", isCal);
    filterGroup.classList.toggle("is-hidden", isCal);
    if (isCal) {
      buildCalendar();
      return null;
    }
    const base = baseEvents();
    ganttInner.replaceChildren();

    if (!EVENTS.length) {
      ganttInner.appendChild(el("div", "empty", "Нет данных о событиях"));
      return null;
    }
    if (!base.length) {
      const box = el("div", "empty");
      box.append(el("span", null, "Нет событий за выбранный период"));
      const all = el("button", "link", "показать все");
      all.type = "button";
      all.addEventListener("click", () => setRange(0));
      box.appendChild(all);
      ganttInner.appendChild(box);
      return null;
    }

    computeRange(base);
    const items = base.filter(matches);

    if (!items.length) {
      const box = el("div", "empty");
      box.append(el("span", null, "Ничего не найдено"));
      const reset = el("button", "link", "сбросить фильтры");
      reset.type = "button";
      reset.addEventListener("click", resetFilters);
      box.appendChild(reset);
      ganttInner.appendChild(box);
      return null;
    }

    layout(items);
    return items;
  }

  function layout(items) {
    const availW = ganttWrap.clientWidth || window.innerWidth || 1000;
    ROW_H = parseFloat(getComputedStyle(ganttWrap).getPropertyValue("--row-h")) || 62;

    TIMELINE_W = 1000;
    DAY_W = TIMELINE_W / TOTAL_DAYS;
    CELLS = buildCells();
    ganttInner.append(renderHeader(), renderBody(items));

    const cornerW = computeCornerWidth(availW);
    const scrollbarW = ganttScroll.offsetWidth - ganttScroll.clientWidth;
    ganttWrap.style.setProperty("--corner-w", cornerW + "px");
    TIMELINE_W = Math.max(100, availW - scrollbarW - cornerW);
    DAY_W = TIMELINE_W / TOTAL_DAYS;
    CELLS = buildCells();
    ganttInner.style.setProperty("--timeline-w", TIMELINE_W + "px");

    ganttInner.replaceChildren(renderHeader(), renderBody(items));
    fitChips();
  }

  /* ---------- tooltip & modal ---------- */
  function ttRow(label, value, valueClass) {
    const row = el("div", "tt-row");
    row.append(el("span", "tt-label", label), el("span", valueClass, value));
    return row;
  }

  function timeOf(h) {
    const raw = (h.time || "").trim();
    if (raw && /[–-]/.test(raw)) return raw;
    const mins = (h.talks || [])
      .map(t => ((t && t.time) || "").trim().match(/^(\d{1,2}):(\d{2})$/))
      .filter(Boolean)
      .map(m => +m[1] * 60 + +m[2]);
    const hhmm = v => String(Math.floor(v / 60)).padStart(2, "0") + ":" + String(v % 60).padStart(2, "0");
    let start = null, suffix = " мск";
    if (raw) {
      const m = raw.match(/(\d{1,2}:\d{2})/);
      if (!m) return raw;
      start = +m[1].split(":")[0] * 60 + +m[1].split(":")[1];
      suffix = raw.slice(m.index + m[0].length);
    } else if (mins.length) {
      start = Math.min(...mins);
    } else {
      return null;
    }
    if (!mins.length) return raw || null;
    const end = Math.max(...mins);
    if (end <= start) return raw || hhmm(start) + suffix;
    return hhmm(start) + "–" + hhmm(end) + suffix;
  }

  function dateLineOf(h) {
    const wY = MIN.getFullYear() !== MAX.getFullYear();
    let line;
    if (Array.isArray(h.phases) && h.phases.length) {
      line = h.phases
        .map(p => fmtRange(p.start, p.end, p.start_approx, wY) + (p.label ? " (" + p.label + ")" : ""))
        .join(" · ");
    } else {
      line = h.start === h.end
        ? (h.start_approx ? "≈" : "") + fmtDate(h.start, wY)
        : fmtRange(h.start, h.end, h.start_approx, wY);
    }
    const time = timeOf(h);
    if (time) line += " · " + time;
    if (h.registration) {
      line += " · рег. " + (wY && h.registration_iso
        ? h.registration.split(" ")[0] + " " + fmtDate(h.registration_iso, true)
        : h.registration);
    }
    return line;
  }

  function regLineOf(h) {
    if (h.registration_iso) return "Рег. до " + fmtDate(h.registration_iso, MIN.getFullYear() !== MAX.getFullYear());
    if (h.registration) return "Рег. " + h.registration;
    return null;
  }

  function phaseLinesOf(h) {
    const wY = MIN.getFullYear() !== MAX.getFullYear();
    return (h.phases || []).map(p => {
      const label = p.label ? p.label.charAt(0).toUpperCase() + p.label.slice(1) : "";
      const icon = (p.label || "").toLowerCase().includes("финал") ? "🏁" : "🎯";
      return { icon: icon, text: (label ? label + " " : "") + fmtRange(p.start, p.end, p.start_approx, wY) };
    });
  }

  function whenRow(icon, text) {
    const row = el("div", "tt-when");
    row.append(el("span", "tt-ico", icon), el("span", null, text));
    return row;
  }

  function renderTip(h) {
    tooltip.replaceChildren();
    const head = el("div", "tt-head");
    head.appendChild(el("span", "tt-name", h.name));
    tooltip.appendChild(head);
    const wY = MIN.getFullYear() !== MAX.getFullYear();
    const approx = h.start_approx ? "≈ " : "";
    const dates = h.start === h.end
      ? approx + fmtDate(h.start, wY)
      : approx + "С " + fmtDate(h.start, wY) + " по " + fmtDate(h.end, wY);
    tooltip.appendChild(whenRow("📅", dates));
    const time = timeOf(h);
    if (time) tooltip.appendChild(whenRow("🕒", time));
    const reg = regLineOf(h);
    if (reg) tooltip.appendChild(whenRow("⏳", reg));
    phaseLinesOf(h).forEach(p => tooltip.appendChild(whenRow(p.icon, p.text)));
    tooltip.classList.remove("hidden");
  }

  function renderFull(container, h) {
    container.replaceChildren();
    const head = el("div", "tt-head");
    const host = h.url ? hostOf(h.url) : "";
    if (host) {
      const exts = ["png", "svg"];
      const img = el("img", "tt-fav");
      img.alt = "";
      img.addEventListener("error", () => {
        if (exts.length) img.src = "icons/" + host + "." + exts.shift();
        else img.remove();
      });
      img.src = "icons/" + host + "." + exts.shift();
      head.appendChild(img);
    }
    head.appendChild(el("span", "tt-name", h.name));
    container.append(head, el("div", "tt-dates", dateLineOf(h)));
    const talks = h.talks || [];
    const cols = el("div", "tt-cols" + (talks.length ? " tt-cols--split" : ""));
    const main = el("div");
    if (h.description && !talks.length) main.appendChild(el("div", "tt-desc", h.description));
    const side = el("div", "tt-col-side tt-links");
    cols.appendChild(main);
    if (talks.length) {
      const program = el("div", "tt-program");
      const section = el("div", "tt-section");
      section.appendChild(el("span", "tt-label", "📋 Программа:"));
      program.appendChild(section);
      const ul = el("ul", "tt-talks");
      talks.forEach(t => {
        const li = el("li");
        li.appendChild(el("span", "tt-talk-time", t.time || ""));
        const body = el("span", "tt-talk-body");
        body.appendChild(el("span", "tt-talk-title", t.title));
        li.appendChild(body);
        ul.appendChild(li);
      });
      program.appendChild(ul);
      cols.appendChild(program);
    }
    container.appendChild(cols);

    const tasks = h.tasks || [];
    if (tasks.length) {
      const section = el("div", "tt-section");
      section.appendChild(el("span", "tt-label", state.tab === "event" ? "🏷️ Темы:" : "🏷️ Треки:"));
      main.appendChild(section);
      const ul = el("ul", "tt-list");
      tasks.forEach(t => ul.appendChild(el("li", null, t)));
      main.appendChild(ul);
    }
    if (h.prize) main.appendChild(ttRow("💰 Приз:", stripLabel(h.prize), "tt-prize"));
    if (h.participation) main.appendChild(ttRow("🏀 Участие:", stripLabel(h.participation)));
    if (h.format) main.appendChild(ttRow("🌐 Формат:", stripLabel(h.format)));
    if (h.lang) main.appendChild(ttRow("🖥️ Язык:", h.lang));

    if (h.url && /^https?:\/\//i.test(h.url)) {
      const a = el("a", "tt-link tt-side-link", "🔗 Открыть страницу события");
      a.href = h.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      side.appendChild(a);
    }
    const links = h.links || [];
    [["stream", "📡 Трансляции:"], ["solutions", "📦 Решения:"], ["ceremony", "🎬 Церемонии:"], ["video", "📺 Видео:"], ["article", "📰 Статьи:"]]
      .forEach(([kind, label]) => {
        const items = links.filter(l => l.kind === kind);
        if (!items.length) return;
        side.appendChild(el("span", "tt-label", label));
        const ul = el("ul", "tt-list");
        items.forEach(l => {
          const a = el("a", "tt-link", l.title);
          a.href = l.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          ul.appendChild(el("li")).appendChild(a);
        });
        side.appendChild(ul);
      });

    const calRow = el("div", "tt-row tt-cal");
    calRow.appendChild(el("span", "tt-label", "📆 В календарь:"));
    const google = el("a", "tt-link", "Google");
    google.href = googleUrl(h.name, h.start, h.end, detailsOf(h));
    google.target = "_blank";
    google.rel = "noopener noreferrer";
    calRow.appendChild(google);
    if (h.registration_iso) {
      const wY = MIN.getFullYear() !== MAX.getFullYear();
      const regText = fmtDate(h.registration_iso, wY);
      const googleReg = el("a", "tt-link", "Google (рег. до " + regText + ")");
      googleReg.href = googleUrl(h.name + " — рег. до " + regText, h.registration_iso, h.registration_iso,
        "Регистрация до " + regText + (h.url ? "\n" + h.url : ""));
      googleReg.target = "_blank";
      googleReg.rel = "noopener noreferrer";
      calRow.appendChild(googleReg);
    }
    const ics = el("button", "tt-link", "Скачать .ics");
    ics.type = "button";
    ics.addEventListener("click", () => downloadICS(h));
    calRow.appendChild(ics);
    main.appendChild(calRow);
    if (side.childNodes.length) {
      if (!talks.length && state.tab === "comp") {
        cols.classList.add("tt-cols--side");
        cols.appendChild(side);
      } else {
        main.appendChild(side);
      }
    }
  }

  /* ---------- calendar export ---------- */
  const pad2 = n => (n < 10 ? "0" : "") + n;
  const compactDate = iso => iso.replace(/-/g, "");
  function addDaysISO(iso, n) {
    const d = parseISO(iso);
    d.setDate(d.getDate() + n);
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function detailsOf(h) {
    const wY = MIN.getFullYear() !== MAX.getFullYear();
    const lines = ["Даты: " + (h.start === h.end
      ? (h.start_approx ? "≈" : "") + fmtDate(h.start, wY)
      : fmtRange(h.start, h.end, h.start_approx, wY))];
    (h.phases || []).forEach(p => {
      lines.push((p.label ? p.label.charAt(0).toUpperCase() + p.label.slice(1) + ": " : "") +
                 fmtRange(p.start, p.end, p.start_approx, wY));
    });
    if (h.time) lines.push("Время: " + h.time);
    if (h.description) lines.push(h.description);
    if (h.registration) {
      const reg = h.registration_iso ? fmtDate(h.registration_iso, wY) : h.registration.replace(/^до\s*/i, "");
      lines.push("Рег. до: " + reg);
    }
    if (h.prize) lines.push(stripLabel(h.prize));
    if (h.format) lines.push(stripLabel(h.format));
    if (h.url) lines.push(h.url);
    return lines.join("\n");
  }

  function googleUrl(text, start, end, details) {
    return "https://calendar.google.com/calendar/render?action=TEMPLATE" +
      "&text=" + encodeURIComponent(text) +
      "&dates=" + compactDate(start) + "/" + compactDate(addDaysISO(end, 1)) +
      (details ? "&details=" + encodeURIComponent(details) : "");
  }

  const TRANSLIT = {
    а: "a", б: "b", в: "v", г: "g", д: "d", е: "e", ё: "e", ж: "zh", з: "z", и: "i",
    й: "y", к: "k", л: "l", м: "m", н: "n", о: "o", п: "p", р: "r", с: "s", т: "t",
    у: "u", ф: "f", х: "h", ц: "ts", ч: "ch", ш: "sh", щ: "sch", ъ: "", ы: "y",
    ь: "", э: "e", ю: "yu", я: "ya",
  };
  function slugify(s) {
    return s.toLowerCase().split("")
      .map(ch => (TRANSLIT[ch] !== undefined ? TRANSLIT[ch] : ch))
      .join("")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "")
      .slice(0, 60) || "event";
  }

  function icsEscape(s) {
    return String(s)
      .replace(/\\/g, "\\\\")
      .replace(/;/g, "\\;")
      .replace(/,/g, "\\,")
      .replace(/\r?\n/g, "\\n");
  }

  function icsFold(line) {
    const out = [];
    let cur = "", len = 0;
    for (const ch of line) {
      const size = encodeURIComponent(ch).replace(/%[0-9A-F]{2}/g, "x").length;
      if (len + size > 73) {
        out.push(cur);
        cur = " ";
        len = 1;
      }
      cur += ch;
      len += size;
    }
    out.push(cur);
    return out.join("\r\n");
  }

  function utcStamp() {
    const d = new Date();
    return d.getUTCFullYear() + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate()) +
      "T" + pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + pad2(d.getUTCSeconds()) + "Z";
  }

  function buildICS(h) {
    const wY = MIN.getFullYear() !== MAX.getFullYear();
    const stamp = utcStamp();
    const uid = slugify(h.name) + "-" + compactDate(h.start);
    const lines = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//hack_calendar//events//RU",
      "CALSCALE:GREGORIAN",
      "BEGIN:VEVENT",
      "UID:" + uid + "@hack-calendar",
      "DTSTAMP:" + stamp,
      "DTSTART;VALUE=DATE:" + compactDate(h.start),
      "DTEND;VALUE=DATE:" + compactDate(addDaysISO(h.end, 1)),
      "SUMMARY:" + icsEscape(h.name),
      "DESCRIPTION:" + icsEscape(detailsOf(h)),
    ];
    if (h.url) lines.push("URL:" + h.url);
    lines.push("END:VEVENT");
    if (h.registration_iso) {
      const reg = fmtDate(h.registration_iso, wY);
      lines.push(
        "BEGIN:VEVENT",
        "UID:" + uid + "-reg@hack-calendar",
        "DTSTAMP:" + stamp,
        "DTSTART;VALUE=DATE:" + compactDate(h.registration_iso),
        "DTEND;VALUE=DATE:" + compactDate(addDaysISO(h.registration_iso, 1)),
        "SUMMARY:" + icsEscape(h.name + " — рег. до " + reg),
        "DESCRIPTION:" + icsEscape("Дедлайн регистрации: " + reg + (h.url ? "\n" + h.url : "")),
      );
      if (h.url) lines.push("URL:" + h.url);
      lines.push("END:VEVENT");
    }
    lines.push("END:VCALENDAR");
    return lines.map(icsFold).join("\r\n") + "\r\n";
  }

  function downloadICS(h) {
    const blob = new Blob([buildICS(h)], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = el("a");
    a.href = url;
    a.download = slugify(h.name) + ".ics";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  let modalLastFocus = null;
  function openModal(h) {
    hideTip();
    modalLastFocus = document.activeElement;
    renderFull(modalContent, h);
    modalCard.classList.toggle("modal--wide", !!(h.talks && h.talks.length));
    modalCard.setAttribute("aria-label", h.name);
    modalBackdrop.classList.remove("hidden");
    modalClose.focus();
  }
  function closeModal() {
    if (modalBackdrop.classList.contains("hidden")) return;
    modalBackdrop.classList.add("hidden");
    modalContent.replaceChildren();
    if (modalLastFocus && typeof modalLastFocus.focus === "function") modalLastFocus.focus();
    modalLastFocus = null;
  }
  modalClose.addEventListener("click", closeModal);
  modalBackdrop.addEventListener("click", e => {
    if (e.target === modalBackdrop) closeModal();
  });

  function placeTip(x, y) {
    const pad = 14, margin = 8;
    const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
    let left = x + pad, top = y + pad;
    if (left + tw > window.innerWidth - margin) left = x - tw - pad;
    if (top + th > window.innerHeight - margin) top = y - th - pad;
    tooltip.style.left = Math.max(margin, left) + "px";
    tooltip.style.top = Math.max(margin, top) + "px";
  }

  function showTip(e, h) {
    renderTip(h);
    placeTip(e.clientX, e.clientY);
  }
  function showTipAtRect(rect, h) {
    renderTip(h);
    placeTip(rect.right + 10, rect.top);
  }
  function moveTip(e) {
    placeTip(e.clientX, e.clientY);
  }
  function hideTip() {
    tooltip.classList.add("hidden");
  }

  /* ---------- theme ---------- */
  function applyTheme(theme, save) {
    document.documentElement.dataset.theme = theme;
    themeToggle.innerHTML = theme === "light" ? MOON_SVG : SUN_SVG;
    const label = theme === "light" ? "Включить тёмную тему" : "Включить светлую тему";
    themeToggle.setAttribute("aria-label", label);
    themeToggle.title = label;
    if (themeColor) themeColor.setAttribute("content", theme === "light" ? "#eef1f7" : "#0d1322");
    if (save) {
      try { localStorage.setItem("hc-theme", theme); } catch (err) {}
    }
  }
  applyTheme(document.documentElement.dataset.theme === "light" ? "light" : "dark", false);
  themeToggle.addEventListener("click", () => {
    applyTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light", true);
  });

  /* ---------- controls ---------- */
  function setRange(n) {
    state.range = n;
    rangeGroup.querySelectorAll(".seg-btn").forEach(btn => {
      const active = Number(btn.dataset.range) === n;
      btn.classList.toggle("is-active", active);
      btn.setAttribute("aria-pressed", String(active));
    });
    build();
  }
  rangeGroup.addEventListener("click", e => {
    const btn = e.target.closest(".seg-btn");
    if (!btn) return;
    const n = Number(btn.dataset.range);
    if (Number.isFinite(n) && n !== state.range) setRange(n);
  });

  filterGroup.addEventListener("click", e => {
    const btn = e.target.closest(".seg-btn");
    if (!btn) return;
    const key = btn.dataset.filter;
    if (key !== "actual" && key !== "signup") return;
    state[key] = !state[key];
    btn.classList.toggle("is-active", state[key]);
    btn.setAttribute("aria-pressed", String(state[key]));
    build();
    calJumpToResults();
  });

  fmtGroup.addEventListener("click", e => {
    const btn = e.target.closest(".seg-btn");
    if (!btn || btn.dataset.fmt === state.fmt) return;
    state.fmt = btn.dataset.fmt;
    fmtGroup.querySelectorAll(".seg-btn").forEach(b => {
      const active = b === btn;
      b.classList.toggle("is-active", active);
      b.setAttribute("aria-pressed", String(active));
    });
    build();
    calJumpToResults();
  });

  tabGroup.addEventListener("click", e => {
    const btn = e.target.closest(".seg-btn");
    if (!btn) return;
    const tab = btn.dataset.tab;
    if ((tab !== "comp" && tab !== "event") || tab === state.tab) return;
    state.tab = tab;
    tabGroup.querySelectorAll(".seg-btn").forEach(b => {
      const active = b === btn;
      b.classList.toggle("is-active", active);
      b.setAttribute("aria-selected", String(active));
    });
    EVENTS = DATASETS[tab];
    try { localStorage.setItem("hc-tab", tab); } catch (err) {}
    ganttScroll.scrollTop = 0;
    build();
    calJumpToResults();
  });

  calPrev.addEventListener("click", () => calShift(-1));
  calNext.addEventListener("click", () => calShift(1));
  calToday.addEventListener("click", () => {
    if (!calScrollToMonth(ymOf(todayMidnight()), true)) {
      const first = calGrid.querySelector(".cal-day[data-ym]");
      if (first) calScrollToMonth(first.dataset.ym, true);
    }
  });

  searchInput.addEventListener("input", () => {
    state.query = searchInput.value.trim().toLowerCase();
    build();
    calJumpToResults();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
    } else if (state.tab === "event" && modalBackdrop.classList.contains("hidden") &&
               (e.key === "ArrowLeft" || e.key === "ArrowRight") &&
               !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
      e.preventDefault();
      calShift(e.key === "ArrowLeft" ? -1 : 1);
    } else if (e.key === "Escape") {
      if (!modalBackdrop.classList.contains("hidden")) {
        closeModal();
        return;
      }
      if (state.query) {
        searchInput.value = "";
        state.query = "";
        build();
      }
      searchInput.blur();
      hideTip();
    }
  });

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    hideTip();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(build, 120);
  });

  build();
})();
</script>
</body>
</html>
